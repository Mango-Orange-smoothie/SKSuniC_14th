<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공정 품질 AI Agent</title>
<style>
:root{
  --bg:#f5f4f8; --surface:#ffffff; --surface-2:#eeecf5;
  --ink:#171523; --ink-muted:#6b6785; --ink-faint:#a4a0bd;
  --accent:#5b54e8; --accent-soft:#eeecfc;
  --border:#e1dff0;
  --good:#0ca30c; --critical:#d03b3b;
  --font-ui: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "D2Coding", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    --bg:#0e0c16; --surface:#17142a; --surface-2:#1e1a35;
    --ink:#ede9fb; --ink-muted:#a49dc9; --ink-faint:#726c99;
    --accent:#9089f7; --accent-soft:#242052;
    --border:#2c2650;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0c16; --surface:#17142a; --surface-2:#1e1a35;
  --ink:#ede9fb; --ink-muted:#a49dc9; --ink-faint:#726c99;
  --accent:#9089f7; --accent-soft:#242052;
  --border:#2c2650;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden}

.app{display:flex;height:100%;width:100%}

/* ---------- 대시보드 영역 — 패널 개수(1~4)에 맞춰 grid-template-columns/rows를 JS에서
   직접 지정한다(renderPanels 참고). auto-fit은 컨테이너의 실제 픽셀 폭에 따라 한 줄에
   몇 칸이 들어갈지가 정해져서(예: 넓으면 4개가 다 1줄에 들어가거나, 3+1처럼 애매하게
   쪼개짐) "패널 개수"라는 의도와 안 맞았다 — 항상 1개=전체, 2개=반반(1행),
   3~4개=2x2(3개면 마지막 칸만 자동으로 비워짐)로 고정한다. */
.dashboard-area{flex:2;min-width:0;display:grid;gap:1px;background:var(--border);overflow-y:auto}
.dash-panel{background:var(--bg);min-width:0;display:flex;flex-direction:column;padding:22px 24px;overflow-y:auto}
.panel-empty{color:var(--ink-faint);font-size:13px;margin:auto;text-align:center;padding:40px 0}
.panel-title{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:2px}
.panel-explain{margin-top:16px;font-size:13.5px;line-height:1.7}
.panel-explain ul{margin:6px 0;padding-left:19px}
.panel-explain li{margin:7px 0}
.panel-explain li b{color:var(--ink-muted);font-size:12.5px;letter-spacing:.02em}
.panel-explain code{font-family:var(--font-mono);background:var(--accent-soft);color:var(--accent);
  padding:2px 6px;border-radius:4px;font-size:12.5px;font-weight:600}

/* ---------- 챗봇 패널(3번) ---------- */
.chat-panel{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;
  transition:flex .18s ease, opacity .15s ease}
.app.chat-closed .chat-panel{flex:0 0 0;width:0;opacity:0;overflow:hidden;pointer-events:none}

header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.eyebrow{font:600 11px/1 var(--font-mono);letter-spacing:.08em;color:var(--accent);
  text-transform:uppercase;margin:0 0 6px}
h1{font-size:19px;margin:0;font-weight:700}
.sub{font-size:12.5px;color:var(--ink-muted);margin:2px 0 0}

.wrap{flex:1;width:100%;margin:0 auto;padding:20px 20px 0;
  display:flex;flex-direction:column;min-height:0}

.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:600 12px var(--font-ui);background:var(--surface);border:1px solid var(--border);
  padding:7px 13px;border-radius:20px;color:var(--ink-muted);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  padding-bottom:16px;min-height:0}
.turn{display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:14px;
  cursor:pointer;transition:background .12s}
.turn:hover{background:var(--surface-2)}
.turn.selected{background:var(--accent-soft)}
.msg{max-width:88%;padding:12px 15px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.agent{align-self:flex-start;background:var(--surface);border:1px solid var(--border);
  border-bottom-left-radius:3px}
.msg.agent.error{border-color:var(--critical);color:var(--critical)}
.msg h3{font-size:15px;font-weight:700;margin:16px 0 6px;padding-top:12px;
  border-top:1px solid var(--border);color:var(--ink)}
.msg h3:first-child{margin-top:0;padding-top:0;border-top:none}
.msg table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
.msg th,.msg td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.msg th{background:var(--surface-2);font-weight:600}
.msg code{font-family:var(--font-mono);background:var(--accent-soft);color:var(--accent);
  padding:2px 6px;border-radius:4px;font-size:12.5px;font-weight:600}
.msg ul{margin:6px 0;padding-left:20px}
.msg li{margin:4px 0}
.msg li b{color:var(--ink-muted);font-size:12.5px;letter-spacing:.02em}
.msg p{margin:6px 0}
.msg p:first-child{margin-top:0}
.msg p:last-child{margin-bottom:0}

.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 15px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:3px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);
  animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.inputbar{display:flex;gap:10px;padding:16px 0 20px;border-top:1px solid var(--border)}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:11px 14px;
  font:14px var(--font-ui);background:var(--surface);color:var(--ink);height:46px;max-height:120px}
textarea:focus{outline:none;border-color:var(--accent)}
button#send{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:0 20px;font:600 14px var(--font-ui);cursor:pointer;white-space:nowrap}
button#send:disabled{opacity:.5;cursor:default}

.disclaimer{font-size:11px;color:var(--ink-faint);text-align:center;padding-bottom:14px}

.chart-wrap{margin-top:10px;overflow-x:auto}
.chart-title{font:600 12px var(--font-ui);color:var(--ink-muted);margin-bottom:4px}
.chart-wrap svg{display:block;min-width:380px}

/* ---------- 챗봇 여닫기 토글 ---------- */
.chat-toggle{position:fixed;top:16px;right:16px;z-index:50;background:var(--accent);color:#fff;
  border:none;border-radius:20px;padding:9px 16px;font:600 13px var(--font-ui);cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.chat-toggle:hover{opacity:.9}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="dashboard-area" id="dashboardArea">
    <div class="dash-panel"><div class="panel-empty">장비 상태를 물어보면 위험인자 그래프가 여기에 표시됩니다</div></div>
  </div>

  <div class="chat-panel" id="chatPanel">
    <header>
      <div>
        <p class="eyebrow">Prototype · v0</p>
        <h1>공정 품질 통합 관리 AI Agent</h1>
      </div>
      <p class="sub">Health Index · 경보 · 확정 유효인자 · SOP 초안을 실시간 조회해서 답합니다</p>
    </header>

    <div class="wrap">
      <div class="suggestions" id="suggestions">
        <div class="chip" data-q="DP03 상태 어때? 문제 있으면 원인이랑 조치도 알려줘.">DP03 상태 어때?</div>
        <div class="chip" data-q="Particle 불량 원인이 뭐야?">Particle 불량 원인?</div>
        <div class="chip" data-q="Vibration 관련 SOP 알려줘.">Vibration SOP는?</div>
        <div class="chip" data-q="DP01이랑 DP03 비교해줘.">DP01 vs DP03</div>
        <div class="chip" data-q="DP03 Vibration 추세 그래프로 보여줘.">Vibration 그래프</div>
        <div class="chip" data-q="Vibration을 4개 장비 전부 그래프로 비교해줘.">Vibration 전체 장비 비교</div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="inputbar">
        <textarea id="input" placeholder="예: DP02 지금 괜찮아?" rows="1"></textarea>
        <button id="send">전송</button>
      </div>
      <p class="disclaimer">이 채팅은 초안입니다. 레벨/추세는 통계적 유의성 재검정 없이 계산된 최근 동향이고, SOP 제안은 DRAFT_UNVERIFIED입니다.</p>
    </div>
  </div>

</div>

<button class="chat-toggle" id="chatToggle">챗봇 닫기</button>

<script>
const appEl = document.getElementById('app');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dashboardAreaEl = document.getElementById('dashboardArea');
const chatToggleBtn = document.getElementById('chatToggle');

// 지난 턴들의 "그 시점 대시보드 상태" 스냅샷을 담아둔다 — 과거 질문을 클릭하면 그때
// 화면에 떠 있던 그래프+설명을 그대로 복원하기 위함(우선순위 없는 질문이었으면 그 이전
// 상태가 그대로 이어져 내려온다). 패널 개수는 조회 결과에 따라 1~4개로 유동적이다.
let currentPanels = null; // null | [panelData, ...] (길이 1~4)
const turns = []; // [{el, panels}]

// ---------- 아주 가벼운 markdown -> html (헤더/굵게/코드/표/목록/문단만 지원, 데모용) ----------
function inline(s){
  return s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function renderMarkdown(md){
  const lines = md.split('\n');
  let html = '';
  let inTable = false, tableRows = [];
  let inList = false;

  function flushTable(){
    if(!tableRows.length) return;
    const [headerRow, sepRow, ...bodyRows] = tableRows;
    const cells = r => r.split('|').map(c=>c.trim()).filter((c,i,arr)=> !(i===0&&c==='') && !(i===arr.length-1&&c===''));
    let t = '<table><thead><tr>' + cells(headerRow).map(c=>`<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
    for(const row of bodyRows){
      t += '<tr>' + cells(row).map(c=>`<td>${inline(c)}</td>`).join('') + '</tr>';
    }
    t += '</tbody></table>';
    html += t;
    tableRows = [];
  }

  for(const raw of lines){
    const line = raw;
    if(/^\s*\|.+\|\s*$/.test(line)){
      inTable = true; tableRows.push(line); continue;
    } else if(inTable){
      inTable = false; flushTable();
    }
    if(/^#{1,3}\s+/.test(line)){
      if(inList){ html += '</ul>'; inList=false; }
      html += `<h3>${inline(line.replace(/^#{1,3}\s+/,''))}</h3>`;
    } else if(/^\s*-\s+/.test(line)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inline(line.replace(/^\s*-\s+/,''))}</li>`;
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      if(line.trim()==='') continue;
      html += `<p>${inline(line)}</p>`;
    }
  }
  if(inTable) flushTable();
  if(inList) html += '</ul>';
  return html;
}

// 장비×변수 시계열 데이터를 받아 선그래프(SVG)를 그린다. baseline/LSL/USL 기준선 포함.
// 외부 차트 라이브러리 없이 직접 좌표 계산 — 데모용, 좌표계는 SVG viewBox 안에서 고정.
function renderChart(cd){
  const W = 640, H = 220, padL = 50, padR = 16, padT = 14, padB = 26;
  const n = cd.series.length;
  if(n < 2) return '';

  const values = cd.series.map(p => p.value);
  const allVals = values.concat([cd.lsl, cd.usl, cd.baseline_median]);
  let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  const pad = (vMax - vMin) * 0.08 || Math.abs(vMax) * 0.05 || 1;
  vMin -= pad; vMax += pad;

  const x = i => padL + (i / (n - 1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - vMin) / (vMax - vMin)) * (H - padT - padB);

  const linePath = cd.series.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const last = cd.series[n - 1];
  const lastColor = cd.spec_status === 'SPEC_OUT' ? 'var(--critical)' : 'var(--accent)';

  const hline = (v, color, dashed) =>
    `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W - padR}" y2="${y(v).toFixed(1)}" stroke="${color}" stroke-width="1"${dashed ? ' stroke-dasharray="4 3"' : ''}/>`;

  return `<div class="chart-wrap">
    <div class="chart-title">${cd.machine_id} · ${cd.factor} 추세 (spec_status: ${cd.spec_status})</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      ${hline(cd.usl, 'var(--critical)', true)}
      ${hline(cd.lsl, 'var(--critical)', true)}
      ${hline(cd.baseline_median, 'var(--ink-faint)', false)}
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <circle cx="${x(n - 1).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.2" fill="${lastColor}"/>
      <text x="${padL}" y="${H - 6}" font-size="9" fill="var(--ink-faint)">${cd.series[0].date}</text>
      <text x="${W - padR}" y="${H - 6}" font-size="9" fill="var(--ink-faint)" text-anchor="end">${last.date}</text>
      <text x="${W - padR}" y="${(y(cd.usl) - 4).toFixed(1)}" font-size="9" fill="var(--critical)" text-anchor="end">USL ${cd.usl}</text>
      <text x="${W - padR}" y="${(y(cd.lsl) + 11).toFixed(1)}" font-size="9" fill="var(--critical)" text-anchor="end">LSL ${cd.lsl}</text>
    </svg>
  </div>`;
}

// ---------- 대시보드 패널(개수 유동) ----------
// 조회 결과 개수만큼 .dash-panel을 그때그때 새로 만든다(1~4개). 레이아웃은 항상:
//   1개 = 전체 1칸 / 2개 = 좌우 반반(1행) / 3~4개 = 2x2 (3개면 마지막 칸만 자동으로 빔)
function setDashboardGrid(n){
  if(n <= 1){
    dashboardAreaEl.style.gridTemplateColumns = '1fr';
    dashboardAreaEl.style.gridTemplateRows = '1fr';
  } else if(n === 2){
    dashboardAreaEl.style.gridTemplateColumns = '1fr 1fr';
    dashboardAreaEl.style.gridTemplateRows = '1fr';
  } else {
    dashboardAreaEl.style.gridTemplateColumns = '1fr 1fr';
    dashboardAreaEl.style.gridTemplateRows = '1fr 1fr';
  }
}

function buildPanelEl(p){
  const el = document.createElement('div');
  el.className = 'dash-panel';
  el.innerHTML =
    `<div class="panel-title">${inline(p.title)}</div>` +
    (p.chart ? renderChart(p.chart) : '') +
    `<div class="panel-explain">${renderMarkdown(p.explanation_md)}</div>`;
  return el;
}

function renderPanels(panelsArr){
  dashboardAreaEl.innerHTML = '';
  if(!panelsArr || !panelsArr.length){
    setDashboardGrid(1);
    const empty = document.createElement('div');
    empty.className = 'dash-panel';
    empty.innerHTML = '<div class="panel-empty">장비 상태를 물어보면 위험인자 그래프가 여기에 표시됩니다</div>';
    dashboardAreaEl.appendChild(empty);
    return;
  }
  setDashboardGrid(panelsArr.length);
  for(const p of panelsArr){
    dashboardAreaEl.appendChild(buildPanelEl(p));
  }
}

// ---------- 채팅 턴(질문+답변 한 쌍) ----------
function startTurn(question){
  const turnDiv = document.createElement('div');
  turnDiv.className = 'turn';
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = question;
  turnDiv.appendChild(userMsg);
  messagesEl.appendChild(turnDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return turnDiv;
}

function finishTurn(turnDiv, text, isError, panelsFromServer){
  const agentMsg = document.createElement('div');
  agentMsg.className = 'msg agent' + (isError ? ' error' : '');
  agentMsg.innerHTML = renderMarkdown(text);
  turnDiv.appendChild(agentMsg);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  if(panelsFromServer){
    currentPanels = panelsFromServer;
    renderPanels(currentPanels);
  }
  // 이번 턴이 끝난 시점의 패널 상태(갱신됐든 이전 그대로든)를 스냅샷으로 저장
  const snapshot = currentPanels ? JSON.parse(JSON.stringify(currentPanels)) : null;
  turns.push({el: turnDiv, panels: snapshot});
  const idx = turns.length - 1;
  turnDiv.addEventListener('click', () => selectTurn(idx));
  selectTurn(idx);
}

function selectTurn(idx){
  turns.forEach((t, i) => t.el.classList.toggle('selected', i === idx));
  renderPanels(turns[idx].panels);
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.remove();
}

async function send(question){
  if(!question.trim()) return;
  const turnDiv = startTurn(question);
  inputEl.value = '';
  sendBtn.disabled = true;
  showTyping();
  try{
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    hideTyping();
    if(!res.ok){
      finishTurn(turnDiv, data.error || '오류가 발생했습니다.', true, null);
    } else {
      finishTurn(turnDiv, data.answer, false, data.panels);
    }
  } catch(err){
    hideTyping();
    finishTurn(turnDiv, '서버에 연결할 수 없습니다: ' + err.message, true, null);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', () => send(inputEl.value));
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send(inputEl.value);
  }
});
document.getElementById('suggestions').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(chip) send(chip.dataset.q);
});

// ---------- 챗봇 여닫기 ----------
chatToggleBtn.addEventListener('click', () => {
  const closed = appEl.classList.toggle('chat-closed');
  chatToggleBtn.textContent = closed ? '챗봇 열기' : '챗봇 닫기';
});
</script>
</body>
</html>
