<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공정 품질 통합 관리 — 대시보드</title>
<style>
:root{
  /* (26.08.12) 화면 전체를 파랑·하늘 계열로. 배경은 파스텔, 강조는 읽히는 파랑.
     경보 3색(good/warn/critical)만 남긴다 — 판정 결과를 나르는 정보라 톤을
     맞추려고 흐리게 하면 화면이 읽히긴 예뻐도 급한 게 안 급해 보인다.
     카드(--surface)는 흰색 그대로 둔다. 배경에만 색을 입혀야 카드가 떠 보이고,
     그래프가 얹히는 면이 무채색이라 선 색이 그대로 나온다.
     회색 3종(ink/ink-muted/ink-faint)도 보라기를 빼고 청회색으로 옮겼다 —
     배경만 파랑으로 가면 본문 글씨에 남은 보라기가 오히려 도드라진다. */
  --bg:#e9f4fd; --surface:#ffffff; --surface-2:#daebfa;
  --ink:#101a26; --ink-muted:#54687e; --ink-faint:#8fa5bb;
  --accent:#1763bd; --accent-soft:#dbeafb;
  /* accent를 배경으로 깔고 그 위에 얹는 글자색. 라이트는 흰색이지만 다크의 accent는
     밝은 하늘색이라 흰 글씨를 얹으면 2.3:1까지 떨어진다(전송 버튼·기간 칩·말풍선).
     #fff를 그대로 박아두면 테마마다 다른 값을 줄 수가 없어 토큰으로 뺐다. */
  --on-accent:#ffffff;
  --border:#c9e0f4;
  --good:#0ca30c; --warn:#d98324; --critical:#d03b3b;
  --font-ui: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "D2Coding", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    /* 다크도 같은 계열로 옮긴다 — OS가 다크면 이쪽이 뜨는데 라이트만 하늘색이면
       발표자 PC 설정에 따라 다른 화면이 나온다. */
    --bg:#0b1523; --surface:#122032; --surface-2:#18293e;
    --ink:#e8f1fb; --ink-muted:#9bb2c9; --ink-faint:#6a8098;
    --accent:#6fb0f2; --accent-soft:#12314f; --border:#24374f;
    --on-accent:#0b1523;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden;font-size:14px}

.app{display:flex;flex-direction:column;height:100%}

/* ---------- 장비 스트립: 질문 전에도 항상 보이는 4대 상태 ---------- */
.strip{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex:0 0 auto}
.mcard{flex:1;background:var(--bg);padding:11px 16px;cursor:pointer;border-top:3px solid transparent}
.mcard:hover{background:var(--surface-2)}
.mcard.active{background:var(--surface);border-top-color:var(--accent)}
.mcard.disabled{cursor:default;opacity:.55}
.mcard-top{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mcard-id{font:600 12px var(--font-mono);color:var(--ink-muted)}
.mcard-hi{font-size:26px;font-weight:700;line-height:1.25}
.mcard-sub{font-size:11.5px;color:var(--ink-muted)}
.mcard-f{font:11.5px var(--font-mono);color:var(--ink-faint)}

.body{flex:1;display:flex;min-height:0}

/* ---------- 사이드바: 스코프 선택 ---------- */
/* 그룹 이름에 (FDC)/(Response)/(Equipment)가 붙어서 214px에선 잘렸다 — 이름을 줄이는
   대신 폭을 넓혔다. 용어 자체가 이 화면에서 설명 역할을 한다. */
.side{flex:0 0 248px;border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;background:var(--surface)}
.side-h{font:600 10.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);padding:8px 14px 5px}
.side.locked{opacity:.4;pointer-events:none}
.grp{margin-bottom:6px}
/* 그룹 헤더와 변수 이름이 같은 크기·굵기면 목록이 한 덩어리로 보인다. 헤더는 크고
   굵게, 변수는 작고 고정폭으로 — 계층이 글자에서 바로 읽혀야 한다. */
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 14px 5px;
  font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none;
  white-space:nowrap}
.grp-h>span:first-child{overflow:hidden;text-overflow:ellipsis}
.grp-h:hover{color:var(--accent)}
.grp-n{font:11px var(--font-mono);color:var(--ink-faint);font-weight:400}
.item{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 18px;cursor:pointer;font-size:12.5px}
.item:hover{background:var(--surface-2)}
.item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item.blocked{opacity:.5}
.item-name{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.active .item-name{color:var(--accent)}
.badge{font:10.5px var(--font-mono);padding:1px 5px;border-radius:3px;flex:0 0 auto}
/* 경보 배지는 두 무게로 그린다. 예전엔 early_warning_active(boolean) 하나로 전부 빨간
   `경보`였는데, 활성 경보 76건 중 65건이 점수를 거의 안 깎는 초기 경보라 HI 99.6짜리와
   HI 14.5짜리가 똑같이 빨갛게 보였다. 빨강은 Health Index가 추세 페널티를 최대폭까지
   받은 경보(alert_level="full", 11건)에만 쓴다 — 그래야 배지 색과 옆 점수가 같은 말을
   한다. 나머지는 배경 없이 흐린 글자로: 정보는 남기고 눈길만 거둔다. */
.badge.alert{background:rgba(208,59,59,.15);color:var(--critical)}
.badge.alert.early{background:none;color:var(--ink-faint);padding:1px 0}
.score{font:600 12.5px var(--font-mono);flex:0 0 auto;min-width:34px;text-align:right}
.side-h .score{font-weight:400}
.chk{display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{accent-color:var(--accent)}

/* ---------- 본문: 뷰 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);flex:0 0 auto}
.tab{padding:11px 15px;font-size:13px;color:var(--ink-muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{flex:1;overflow-y:auto;padding:18px 22px}

/* ---------- 패널 그리드 ----------
   1개는 한 칸, 2개는 좌우, 3개부터는 2열이고 넘치는 만큼 아래로 쌓여 세로 스크롤이
   된다(2x2가 화면에 들어오고 5번째부터는 스크롤). 열을 3개 이상으로 쪼개면 축
   글자가 못 읽을 크기가 돼서 여기서 멈춘다. */
.panes{display:grid;gap:16px;align-items:start}
.panes.n1{grid-template-columns:1fr}
.panes.n2,.panes.n3{grid-template-columns:1fr 1fr}

.pane{min-width:0;border:1px solid transparent;border-radius:12px}
/* 조작 중인 패널이 어느 것인지 보이게 — 고정된 것과 섞이면 사이드바가 무엇을
   바꾸는지 알 수 없다. */
.pane.live{border-color:var(--accent)}
.pane.pinned{border-color:var(--border);background:rgba(127,127,127,.04)}

.pane-head{display:flex;align-items:center;gap:8px;padding:7px 10px 0}
.pane-tag{font:600 11px var(--font-mono);letter-spacing:.04em}
.pane.live .pane-tag{color:var(--accent)}
.pane.pinned .pane-tag{color:var(--ink-faint)}
.pane-acts{margin-left:auto;display:flex;gap:3px}
.pane-acts button{background:none;border:1px solid transparent;border-radius:7px;
  padding:3px 9px;font:600 11.5px var(--font-ui);line-height:1.5;cursor:pointer;color:var(--ink-faint)}
.pane-acts button:hover{background:var(--surface-2);color:var(--ink)}
.pane-acts button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pane-body{padding:4px 10px 10px}
.vhead{display:flex;align-items:baseline;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.vtitle{font-size:18px;font-weight:700}
.vsub{font-size:12.5px;color:var(--ink-muted)}
.rngbar{display:flex;align-items:center;gap:6px;margin-left:auto}
.rng{font-size:12px;padding:4px 10px;border-radius:14px;cursor:pointer;color:var(--ink-muted);
  border:1px solid var(--border)}
.rng:hover{border-color:var(--accent);color:var(--accent)}
.rng.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.rng-n{font-size:11px;color:var(--ink-faint);margin-left:4px}
.empty{color:var(--ink-faint);text-align:center;padding:60px 20px;font-size:13px;line-height:1.8}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.nums{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:13px}
.num-l{font-size:11px;color:var(--ink-faint)}
.num-v{font:16px var(--font-mono);margin-top:1px}
.pill{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:600}
.pill.t1{background:rgba(208,59,59,.14);color:var(--critical)}
.pill.t2{background:rgba(217,131,36,.16);color:var(--warn)}
.pill.mon{background:var(--accent-soft);color:var(--accent)}
.pill.na{background:var(--surface-2);color:var(--ink-muted)}

.gauge-l{font-size:11px;color:var(--ink-faint);margin-bottom:4px}
.gauge{height:11px;background:var(--surface-2);border-radius:6px;overflow:hidden;position:relative}
.gauge-fill{height:100%}
.gauge-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:4px}
.note{font-size:12px;color:var(--ink-muted);background:var(--surface-2);
  padding:7px 11px;border-radius:6px;margin-top:10px;line-height:1.6}

/* 위험/정상 구간을 글자로 나열하면 두 범위의 관계(어디가 위고 어디가 아래인지, 지금 값이
   어느 쪽에 붙어 있는지)가 안 읽힌다 — 같은 축 위에 그려서 위치로 보여준다. */
.band{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.band-h{font-size:11px;color:var(--ink-faint);margin-bottom:7px}
.band-foot{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.6}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dtable{border-collapse:collapse;font-size:12.5px;margin-top:4px;min-width:340px}
.dtable th{font-size:11px;font-weight:400;color:var(--ink-faint);text-align:left;
  padding:0 16px 4px 0;border-bottom:1px solid var(--border)}
.dtable td{padding:6px 16px 6px 0;font-family:var(--font-mono);color:var(--ink-muted)}
.dtable td:first-child{font-family:var(--font-ui);color:var(--ink)}
.dtable td.hot{color:var(--critical);font-weight:600}
.dtable tr.nowrow td{border-top:1px solid var(--border)}
.meta{border-top:1px solid var(--border);margin-top:12px;padding-top:9px;
  font-size:12px;color:var(--ink-muted);line-height:1.85}
.meta code{font-family:var(--font-mono);font-size:11.5px;background:var(--accent-soft);
  color:var(--accent);padding:1px 5px;border-radius:3px}

/* ---------- 히트맵 ---------- */
.hm{display:grid;gap:2px;margin-top:6px}
.hm-cell{aspect-ratio:1.7;display:flex;align-items:center;justify-content:center;
  font:11.5px var(--font-mono);border-radius:3px}
.hm-lab{font-size:11px;color:var(--ink-muted);display:flex;align-items:center;justify-content:center}
.hm-lab.row{justify-content:flex-end;padding-right:8px}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--ink-muted)}
.legend-bar{height:10px;width:170px;border-radius:5px;
  background:linear-gradient(to right, var(--surface-2), var(--critical))}

/* height 속성을 안 준다 — viewBox 비율대로 폭에 맞춰 높이가 따라온다.
   예전엔 height=210으로 고정돼 있어서, 카드가 640보다 넓으면 배율이 1로 묶이고
   그림이 가운데 640px에만 그려졌다(좌우 400px씩 빈 공간). 패널을 2x2로 쪼개면
   반대로 배율이 0.7까지 떨어져 축 글자가 안 읽혔다. 비율을 따라가게 두면 둘 다 없다. */
.chart svg{display:block;width:100%;height:auto}
.chart svg.ix{cursor:crosshair}
.chart-t{font-size:12px;color:var(--ink-muted);margin-bottom:5px}

/* ---------- 그래프 위 값 읽기(크로스헤어 툴팁) ----------
   position:fixed라 카드의 overflow에 잘리지 않는다. */
#chartTip{position:fixed;z-index:80;pointer-events:none;display:none;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:8px 11px;font-size:12px;color:var(--ink);line-height:1.6;
  box-shadow:0 6px 22px rgba(0,0,0,.45);max-width:290px}
#chartTip .tp-d{font:700 11.5px var(--font-mono);color:var(--ink-muted);margin-bottom:3px}
#chartTip .tp-r{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
#chartTip .tp-k{color:var(--ink-muted);font-size:11px}
#chartTip .tp-v{font:600 12px var(--font-mono);margin-left:auto}
#chartTip .tp-s{width:8px;height:8px;border-radius:2px;flex:0 0 auto}

/* ---------- 내보내기 버튼 — 카드에 마우스를 올렸을 때만 보인다 ---------- */
.chart-acts{display:flex;gap:3px;justify-content:flex-end;margin-bottom:-4px;
  opacity:0;transition:opacity .12s}
.card:hover .chart-acts,.chart-acts:focus-within{opacity:1}
.chart-acts button{background:none;border:1px solid transparent;border-radius:7px;
  padding:3px 8px;font-size:12px;line-height:1.4;cursor:pointer;color:var(--ink-faint)}
.chart-acts button:hover{background:var(--surface-2,rgba(255,255,255,.06));color:var(--ink)}
.chart-acts button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--bg);font:600 12.5px var(--font-ui);
  padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* ---------- 에이전트 패널 ---------- */
.agent{flex:0 0 316px;border-left:1px solid var(--border);display:flex;flex-direction:column;
  background:var(--surface)}
.app.agent-closed .agent{display:none}
.agent-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center}
.agent-h b{font-size:13px}
.agent-h button{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:0 2px}
.msgs{flex:1;overflow-y:auto;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.m{font-size:12.5px;line-height:1.65;padding:9px 12px;border-radius:10px;max-width:94%}
.m.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.m.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.m.a.err{color:var(--critical)}
.m code{font-family:var(--font-mono);font-size:11.5px}
.m h3{font-size:13px;margin:10px 0 4px}
.m h3:first-child{margin-top:0}
.m ul{margin:5px 0;padding-left:17px}
.m p{margin:5px 0}
/* 표는 316px 패널보다 넓어질 수 있다(레시피 조합 이름이 길다). 셀을 줄여서 읽기를
   포기하는 대신 표만 가로로 굴린다 — 말풍선 자체는 안 넘친다. */
.m .tw{overflow-x:auto;margin:6px 0}
.m table{border-collapse:collapse;width:100%;font-size:11.5px}
.m th,.m td{border:1px solid var(--border);padding:3px 6px;text-align:left}
.m th{color:var(--ink-muted);font-weight:600;white-space:nowrap}
.m td{font-family:var(--font-mono)}

/* 첫 화면 안내. **말풍선으로 그리지 않는다** — 모델이 한 말과 화면이 만든 말이 같은
   모양이면, 부팅 시점에 이미 LLM이 뭔가 판단한 것처럼 보인다. 이 문단은 /api/bootstrap
   숫자를 그대로 쓴 정적 안내다. */
.intro{font-size:12px;color:var(--ink-muted);line-height:1.7;padding-bottom:4px;
  border-bottom:1px solid var(--border)}
.intro b{color:var(--ink)}
.intro code{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.intro .hi{font:600 13px var(--font-mono)}
.intro-t{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
.jump{align-self:flex-start;font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  padding:5px 10px;border-radius:6px}
.hints{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 10px}
.hint{font-size:11.5px;background:var(--bg);border:1px solid var(--border);padding:5px 9px;
  border-radius:14px;color:var(--ink-muted);cursor:pointer}
.hint:hover{border-color:var(--accent);color:var(--accent)}
/* flex-end: 입력창이 커질 때 전송 버튼은 아래(마지막 줄 옆)에 붙어 있어야 한다 */
.inbar{display:flex;align-items:flex-end;gap:7px;padding:11px 14px;border-top:1px solid var(--border)}
/* 높이 38px 고정이라 두 줄짜리 질문이 한 줄 안에 갇혀 앞부분이 안 보였다. 내용만큼
   늘리고 120px(약 5줄)에서 멈춰 스크롤 — 대화 로그가 입력창에 먹히지 않게 한다. */
.inbar textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font:12.5px var(--font-ui);background:var(--bg);color:var(--ink);
  height:38px;min-height:38px;max-height:120px;overflow-y:auto;line-height:1.5}
.inbar textarea:focus{outline:none;border-color:var(--accent)}
.inbar button{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;
  padding:0 14px;font:600 12.5px var(--font-ui);cursor:pointer}
.inbar button:disabled{opacity:.5;cursor:default}
.foot{font-size:10.5px;color:var(--ink-faint);padding:0 14px 11px;line-height:1.6}
.reopen{position:fixed;right:14px;bottom:14px;background:var(--accent);color:var(--on-accent);border:none;
  border-radius:18px;padding:9px 15px;font:600 12.5px var(--font-ui);cursor:pointer;display:none}
.app.agent-closed .reopen{display:block}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="strip" id="strip"></div>

  <div class="body">
    <div class="side" id="side"></div>

    <div class="main">
      <div class="tabs" id="tabs"></div>
      <div class="view" id="view"><div class="panes n1" id="panes"></div></div>
    </div>

    <div class="agent">
      <div class="agent-h">
        <b>AI Agent</b>
        <button id="closeAgent" title="닫기">×</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="hints" id="hints"></div>
      <div class="inbar">
        <textarea id="q" rows="1" placeholder="예: DP04 왜 그렇게 낮아?"></textarea>
        <button id="send">전송</button>
      </div>
    </div>
  </div>
</div>
<button class="reopen" id="reopenAgent">AI Agent</button>

<!-- 그래프 툴팁·토스트 — body 직속이라 카드 스크롤 영역에 잘리지 않는다 -->
<div id="chartTip"></div>
<div id="toast"></div>

<script>
// ===================================================================
// 뷰 상태 — 화면이 가질 수 있는 상태는 이 객체 하나로 전부 표현된다.
// 사이드바 클릭도, 챗봇 답변도 결국 이걸 만들고 /api/view로 보낸다.
//   {view, machine, factor, defects}
// 뷰마다 필요한 스코프가 달라서(VIEWS 참고) 선택기를 켜고 끄는 근거가 된다.
// ===================================================================
const VIEWS = [
  {id:'trend',   label:'추세',        needs:{machine:'single', factor:true}},
  {id:'defect',  label:'불량 발생',    needs:{machine:'single', defects:true}},
  {id:'heatmap', label:'레시피 히트맵', needs:{machine:'single', factor:true}},
  {id:'compare', label:'장비 비교',    needs:{machine:'all',    factor:true}},
];
// 계열 색 4종. 보라를 뺐다(26.08.12) — 나머지 3색은 경보색과 같은 값이라 유지한다.
// Chipping은 --accent(파랑)와 같은 그림 안에 겹쳐 그려진다(추세 화면에서 인자선 =
// accent, 불량률선 = 이 표). 그래서 파랑이 아니라 청록으로 뺐다 — DP02 Laser_Power가
// 정확히 그 경우(인자선 파랑 + Chipping 불량률선)라 같은 파랑이면 두 선이 붙는다.
const DEFECT_COLORS = {Chipping:'#0d8fa8', Remain_Coat:'#d98324', Particle:'#0ca30c', Micro_Crack:'#d03b3b'};
// 장비 비교 화면에는 accent로 그리는 선이 없어서 DP01은 파랑을 그대로 쓸 수 있다.
const MACHINE_COLORS = {DP01:'#2f7fd6', DP02:'#0ca30c', DP03:'#d98324', DP04:'#d03b3b'};

let BOOT = null;

// ── 패널 ────────────────────────────────────────────────────────────
// 화면은 패널 여러 개다. 예전에 "화면 하나"가 전역으로 들고 있던 것(선택 상태 ·
// 받아온 데이터 · 확대 구간 · 요청 토큰)을 패널마다 따로 갖는다.
//
// 규칙이 하나뿐이라 단순하다: **고정되지 않은 패널이 항상 정확히 하나 있고,
// 사이드바·탭·스트립은 그 패널만 바꾼다.** 고정(📌)하면 그 패널은 얼어붙고
// 같은 내용의 새 패널이 옆에 생긴다 — 그다음 선택부터는 새 패널이 받는다.
const DEFAULT_STATE = {view:'trend', machine:null, factor:null,
                       defects:['Chipping','Remain_Coat','Particle','Micro_Crack']};
let panes = [];
let paneSeq = 0;

const newPane = init => ({
  id: 'pane' + (++paneSeq),
  el: null, body: null,          // DOM
  pinned: false,
  state: JSON.parse(JSON.stringify(init)),
  data: null,                    // /api/view 응답
  zoom: null,                    // {from,to} — 드래그 확대
  token: 0,                      // 늦게 도착한 응답이 최신 화면을 덮지 않게
});

// 고정 안 된 패널 = 지금 조작 중인 패널. 항상 하나 있다(pinPane이 보장한다).
const livePane = () => panes.find(p => !p.pinned) || panes[panes.length - 1];

panes.push(newPane(DEFAULT_STATE));

// 기존 코드가 읽던 `state`는 이제 **조작 중인 패널의 상태**를 가리키는 별칭이다.
// 사이드바·탭·스트립·needs()가 전부 이걸 읽으므로, 그 코드들은 그대로 둔다.
// (패널을 지정해서 그려야 하는 곳 — renderTrend의 기간 선택기 등 — 은 별칭 대신
//  p.state를 직접 쓴다. 활성이 아닌 패널을 그릴 때 값이 섞이면 안 되기 때문이다.)
Object.defineProperty(globalThis, 'state', {get: () => livePane().state, configurable: true});
// 관계 미확정 37개는 기본 접힘 — 원인/감시지표를 먼저 보게 한다(그룹 이름은 views.py의
// GROUP_OTHER와 정확히 같아야 한다).
const collapsed = {'관계 미확정 (안전망)': true};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hiColor = v => v == null ? 'var(--ink-faint)' : v < 50 ? 'var(--critical)' : v < 80 ? 'var(--warn)' : 'var(--good)';
const needs = () => VIEWS.find(v => v.id === state.view).needs;

// 경보 지속일. 40일짜리에 소수점을 붙이면 자리만 먹고, 0.2일짜리를 반올림하면 "0일"이
// 되어 뜻이 사라진다 — 하루를 기준으로 표기를 바꾼다.
const alertDays = d => d == null ? '' : (d >= 1 ? `${Math.round(d)}일` : `${d.toFixed(1)}일`);

// 사이드바 경보 배지. **경보 여부가 아니라 세기를 그린다** — 배지가 빨간데 옆 점수가
// 99.6이면 둘 중 하나는 거짓말이고, 그게 26.08.11 이전 화면의 상태였다. 빨강은
// alert_level="full"(Health Index가 추세 페널티를 최대폭까지 받은 경보)에만 준다.
// 초기 경보는 지우지 않는다 — DP04 CLN_Flow도 39일 전엔 0.1일째였다. 흐리게 남긴다.
function alertBadge(it){
  if(!it.early_warning_active) return '';
  const full = it.alert_level === 'full';
  const days = alertDays(it.alert_active_days);
  const tip = full
    ? `${days}째 지속 — 점수에 최대폭 반영됨`
    : `${days}째 — 아직 초기라 점수를 거의 안 깎는다(지속되면 빨갛게 바뀜)`;
  return `<span class="badge alert ${full ? '' : 'early'}" title="${esc(tip)}">경보 ${days}</span>`;
}

// ---------- 부팅 ----------
async function boot(){
  try{
    BOOT = await (await fetch('/api/bootstrap')).json();
  }catch(err){
    $('panes').innerHTML = `<div class="empty">서버에 연결할 수 없습니다 — ${esc(err.message)}<br>server.py가 떠 있는지 확인하세요.</div>`;
    return;
  }
  if(BOOT.error){ $('panes').innerHTML = `<div class="empty">${esc(BOOT.error)}</div>`; return; }
  Object.assign(livePane().state, BOOT.default_state);
  syncGlobalUI(); renderHints(); renderIntro();
  renderPanes();
  loadPane(livePane());
}

// ---------- 장비 스트립 ----------
function renderStrip(){
  const all = needs().machine === 'all';
  $('strip').innerHTML = BOOT.machines.map(m => `
    <div class="mcard ${all ? 'disabled' : (m.machine_id === state.machine ? 'active' : '')}" data-m="${m.machine_id}">
      <div class="mcard-top">
        <span class="dot" style="background:${hiColor(m.health_index)}"></span>
        <span class="mcard-id">${m.machine_id}</span>
      </div>
      <div class="mcard-hi" style="color:${hiColor(m.health_index)}">${m.health_index ?? '—'}</div>
      <div class="mcard-sub">${esc(m.worst_defect ?? '—')}</div>
      <div class="mcard-f">${esc(m.worst_factor ?? '')}</div>
    </div>`).join('');
  if(!all){
    $('strip').querySelectorAll('.mcard').forEach(el =>
      el.onclick = () => setState({machine: el.dataset.m}));
  }
}

// ---------- 탭 ----------
function renderTabs(){
  $('tabs').innerHTML = VIEWS.map(v =>
    `<div class="tab ${v.id === state.view ? 'active' : ''}" data-v="${v.id}">${v.label}</div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(el =>
    el.onclick = () => setState({view: el.dataset.v}));
}

// ---------- 사이드바 (뷰에 따라 내용이 바뀐다) ----------
function renderSide(){
  const n = needs();
  const side = $('side');

  if(n.defects){
    side.className = 'side';
    side.innerHTML = `<div class="side-h">불량 항목</div>` + BOOT.defects.map(d => `
      <label class="chk">
        <input type="checkbox" data-d="${d}" ${state.defects.includes(d) ? 'checked' : ''}>
        <span class="dot" style="background:${DEFECT_COLORS[d]}"></span>
        <span>${d}</span>
      </label>`).join('');
    side.querySelectorAll('input').forEach(el => el.onchange = () => {
      const picked = [...side.querySelectorAll('input:checked')].map(i => i.dataset.d);
      setState({defects: picked.length ? picked : state.defects});
    });
    return;
  }

  // compare 뷰는 장비를 안 쓰지만 변수는 쓴다 — 변수 목록은 대표로 첫 장비 것을 보여준다
  // (변수 집합은 4대가 같고, 경보 배지만 장비별로 다르다).
  const machine = n.machine === 'all' ? BOOT.machines[0].machine_id : state.machine;
  const tree = BOOT.variables[machine] || [];
  side.className = 'side';
  side.innerHTML = `<div class="side-h" style="display:flex;justify-content:space-between">
      <span>변수</span><span>점수</span></div>` + tree.map(g => {
    const open = !collapsed[g.group];
    const items = open ? g.items.map(it => {
      const blocked = !it.defects.length && it.blocked_defects.length;
      const title = blocked
        ? `관계DB가 이 짝으로는 경보를 못 걸게 막아둠 (${it.blocked_defects.join(', ')})`
        : (it.defects.length ? `원인: ${it.defects.join(', ')}` : '확정 원인 아님 — 안전망 감시');
      // 목록에 점수를 바로 실어서, 추세 탭을 눌러보지 않아도 어느 변수가 급한지 보이게
      // 한다(정렬도 이 점수 기준). tier(T1/T2)는 처음 보는 사람이 못 읽으므로 뺐다 —
      // 조치 긴급도는 변수를 고르면 추세 화면 헤더에 한국어로 나온다.
      const hi = it.health_index;
      return `<div class="item ${it.factor === state.factor ? 'active' : ''} ${blocked ? 'blocked' : ''}"
                   data-f="${it.factor}" title="${esc(title)}">
          <span class="item-name">${it.factor}</span>
          ${alertBadge(it)}
          <span class="score" style="color:${hiColor(hi)}">${hi == null ? '—' : hi.toFixed(1)}</span>
        </div>`;
    }).join('') : '';
    // 접힌 그룹에도 경보가 있다는 걸 알려야 하지만, "경보 N" 글자는 그룹 이름과 경쟁해서
    // 헤더가 시끄러웠다. 빨간 불 하나로 줄인다 — 개수는 툴팁으로.
    // (26.08.11) 빨간 불은 full 경보만 센다. 전부 세면 네 그룹에 다 불이 켜져서 어느
    // 그룹을 펼칠지 못 고른다 — 초기 경보 개수는 툴팁에 같이 적어 안 잃어버린다.
    const alerts = g.alert_count_full
      ? `<span class="dot" style="background:var(--critical)"
              title="지속 경보 ${g.alert_count_full}개 (초기 경보 ${g.alert_count - g.alert_count_full}개 포함 총 ${g.alert_count}개)"></span>` : '';
    return `<div class="grp">
        <div class="grp-h" data-g="${esc(g.group)}">
          <span>${open ? '▾' : '▸'} ${esc(g.group)}</span>
          <span style="display:flex;align-items:center;gap:6px;flex:0 0 auto">${alerts}<span class="grp-n">${g.items.length}</span></span>
        </div>${items}
      </div>`;
  }).join('');

  side.querySelectorAll('.grp-h').forEach(el => el.onclick = () => {
    collapsed[el.dataset.g] = !collapsed[el.dataset.g];
    renderSide();
  });
  side.querySelectorAll('.item').forEach(el =>
    el.onclick = () => setState({factor: el.dataset.f}));
}

function renderHints(){
  const hints = ['DP04 왜 그렇게 낮아?', 'DP01이랑 DP03 비교해줘', 'Particle 불량 원인이 뭐야?'];
  $('hints').innerHTML = hints.map(h => `<div class="hint">${esc(h)}</div>`).join('');
  $('hints').querySelectorAll('.hint').forEach(el => el.onclick = () => ask(el.textContent));
}

// 첫 화면 안내. 예전엔 대화창이 완전히 비어 있어서 힌트 칩 3개만 떠 있었고, 그 3개가
// 이 패널이 할 수 있는 일의 전부처럼 보였다.
// **숫자는 여기서 다시 세지 않고 사이드바가 쓰는 것과 같은 트리에서 센다** — 안내문이
// "지속 경보 N개"라고 말한 뒤 사이드바에서 빨간 배지를 세면 N이 나와야 한다.
function renderIntro(){
  let full = 0, early = 0;
  for(const tree of Object.values(BOOT.variables))
    for(const g of tree){ full += g.alert_count_full; early += g.alert_count - g.alert_count_full; }

  const worst = BOOT.machines[0];   // views.py가 나쁜 순으로 정렬해 보낸다
  $('msgs').innerHTML = `<div class="intro">
      <div class="intro-t">장비·변수·불량에 대해 물어보세요</div>
      가장 낮은 장비는 <b>${worst.machine_id}</b>
      <span class="hi" style="color:${hiColor(worst.health_index)}">${worst.health_index ?? '—'}</span>
      (${esc(worst.worst_defect ?? '—')} · <code>${esc(worst.worst_factor ?? '')}</code>).
      4대 합쳐 지속 경보 <b>${full}개</b>, 초기 경보 ${early}개.<br>
      답변에는 근거 숫자가 같이 나오고, 관련 화면으로 함께 이동합니다.
    </div>`;
}

// ---------- 상태 전이 ----------
function setState(patch){
  Object.assign(livePane().state, patch);
  syncGlobalUI();
  loadPane(livePane());
}

// 사이드바·탭·스트립은 "조작 중인 패널" 하나를 비추는 거울이다.
function syncGlobalUI(){ renderTabs(); renderStrip(); renderSide(); }

// ---------- 패널 그리기 ----------
const gridClass = n => n <= 1 ? 'n1' : n === 2 ? 'n2' : 'n3';

function renderPanes(){
  const host = $('panes');
  host.className = 'panes ' + gridClass(panes.length);
  host.innerHTML = '';
  for(const p of panes){
    const el = document.createElement('section');
    el.className = 'pane ' + (p.pinned ? 'pinned' : 'live');
    el.dataset.id = p.id;
    el.innerHTML = `<div class="pane-head">
        <span class="pane-tag">${p.pinned ? '📌 고정됨' : '● 선택 중'}</span>
        <div class="pane-acts">
          ${p.pinned
            ? `<button data-close title="이 패널 닫기">✕ 닫기</button>`
            : `<button data-pin title="지금 화면을 고정하고, 다음 선택은 새 패널에 띄웁니다">📌 고정</button>`}
        </div>
      </div><div class="pane-body"></div>`;
    host.appendChild(el);
    p.el = el;
    p.body = el.querySelector('.pane-body');
    el.querySelector('[data-pin]')?.addEventListener('click', () => pinPane(p));
    el.querySelector('[data-close]')?.addEventListener('click', () => closePane(p));
    paintPane(p);
  }
}

// 데이터가 있으면 그걸로 그리고, 없으면 안내만 띄운다(로딩은 loadPane이 건다).
function paintPane(p){
  if(!p.body) return;
  if(!p.data){ p.body.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  ({trend:renderTrend, defect:renderDefect,
    heatmap:renderHeatmap, compare:renderCompare}[p.data.view])(p.data, p);
}

// 고정 = 이 패널을 얼리고, 같은 내용의 새 패널을 옆에 연다. 그다음 선택부터는
// 새 패널이 받으므로 둘이 나란히 비교된다.
function pinPane(p){
  p.pinned = true;
  const np = newPane(p.state);
  np.data = p.data;          // 같은 내용으로 시작 — 다시 불러올 필요가 없다
  panes.push(np);
  renderPanes();
  syncGlobalUI();
}

function closePane(p){
  const i = panes.indexOf(p);
  if(i < 0) return;
  panes.splice(i, 1);
  if(!panes.length) panes.push(newPane(DEFAULT_STATE));   // 최소 하나는 남긴다
  renderPanes();
  syncGlobalUI();
}

// 요청 토큰 — 사이드바를 빠르게 연속 클릭하면 먼저 보낸 요청이 나중에 도착해서 최신
// 화면을 덮어쓸 수 있다(변수 목록은 클릭이 빠르다). 패널마다 따로 센다.
async function loadPane(p){
  const token = ++p.token;
  if(p.body) p.body.innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const res = await fetch('/api/view', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(p.state)
    });
    const d = await res.json();
    if(token !== p.token) return;  // 그 사이 더 최신 요청이 나갔다
    if(d.error){ p.body.innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    // 새로 받아온 구간이므로 이전 화면의 확대는 푼다(인덱스 기준이 달라진다)
    p.zoom = null; p.data = d;
    paintPane(p);
  }catch(err){
    // 서버가 내려가 있으면 여기로 온다. 안 잡으면 "불러오는 중…"에서 영영 멈춘다.
    if(token !== p.token) return;
    p.body.innerHTML = `<div class="empty">서버에 연결할 수 없습니다 — ${esc(err.message)}<br>server.py가 떠 있는지 확인하세요.</div>`;
  }
}

// ===================================================================
// 뷰 1 — 추세. 카드에는 숫자와 그림만 둔다(설명 문장은 에이전트 몫).
// ===================================================================
function renderTrend(d, p){
  const c = d.chart, det = d.detail || {}, meta = d.meta || {};
  const margin = det.margin_used_pct;
  // 조치 긴급도는 tier 코드(T1/T2)가 아니라 한국어 그대로 보여준다 — 처음 보는 사람이
  // T1을 못 읽는다. 색은 여전히 긴급도별로 다르게 준다.
  // 색은 action_type 문자열이 아니라 tier로 고른다. 전에는 한국어 문구를 나열해
  // 맞췄는데(['즉시조치','급락알람']), DB가 급락알람을 즉시조치로 고치자(PR #23)
  // 목록에 죽은 값이 남았다. 문구는 바뀔 수 있고 tier는 취급법의 단일 근거다.
  // 보여주는 글자는 그대로 한국어 문구 — 처음 보는 사람이 T1을 못 읽는다.
  const urgency = meta.action_type;
  const urgCls = { T1: 't1', T2: 't2', M1: 'mon' }[meta.tier] || 'na';

  // 스펙 위치를 %로 환산해 설명하던 문구는 뺐다 — 스펙선은 그래프에 이미 그려지고,
  // 점수 기준선(관리한계)도 같이 그려지므로 두 축의 차이는 그림에서 바로 보인다.

  const num = (l, v, color) => v == null ? '' :
    `<div><div class="num-l">${l}</div><div class="num-v" ${color ? `style="color:${color}"` : ''}>${v}</div></div>`;

  // 기간 선택 — 불량 뷰와 같은 state.days 통로를 쓴다. "기본"은 서버가 창을 자동으로
  // 잡는 것(경보 시작 14일 전~, 경보가 없으면 최근 30일)이고, "전체"는 89일 전부다.
  const ranges = [[null,'기본'],[89,'전체'],[30,'30일'],[7,'7일']];
  const picker = ranges.map(([v,label]) =>
    `<span class="rng ${!p.zoom && (p.state.days ?? null) === v ? 'on' : ''}" data-days="${v ?? ''}">${label}</span>`).join('');
  const zc = zoomedChart(c, p.zoom);   // 드래그로 확대 중이면 그 구간만 그린다

  p.body.innerHTML = `
    <div class="vhead">
      <div class="vtitle">${d.machine} · ${d.factor}</div>
      ${urgency ? `<span class="pill ${urgCls}">${esc(urgency)}</span>` : '<span class="pill na">확정 원인 아님</span>'}
      ${(() => {
        // 인자 이름으로 분기하지 않는다 — 관계DB에서 만든 단일 표(related_defects)를
        // tier/is_cause로만 갈라 줄을 만든다. 새 짝이 DB에 추가돼도 여기는 안 고친다.
        const rel = d.related_defects || (d.defect ? [{defect:d.defect, is_cause:true, alert_usable:true}] : []);
        const cause = rel.filter(r => r.is_cause), cand = rel.filter(r => !r.is_cause);
        const label = r => {
          // alert_usable=false = "재봤는데 경계가 안 갈렸다"(risk_ratio 0.80).
          // "미검증"으로 쓰면 "아직 안 봤다"로 읽히므로 기준이 없다고 쓴다.
          if(r.alert_usable === false) return `<span title="관계는 tier ${esc(r.tier||'')}로 인정된 짝이지만, 이 변수 값으로 위험구간 선을 그을 수 없다 — 경계 아래 불량률이 위보다 낮게 나왔다(risk_ratio 0.80).">`
            + `${esc(r.defect)} <span style="color:var(--ink-faint)">(위험구간 기준 없음)</span></span>`;
          return esc(r.defect);
        };
        let out = '';
        if(cause.length) out += `<div class="vsub">${meta.actionable === false ? '감시지표' : '원인'} → ${cause.map(label).join(' · ')}</div>`;
        // T3 = "원인이라고 답하지 말 것"(관계DB tier_legend) — 그래서 줄을 나눈다.
        if(cand.length) out += `<div class="vsub" style="color:var(--ink-faint)">감시 후보 → ${
          cand.map(r => `<span title="${esc(r.reason || '')}">${esc(r.defect)} (${esc(r.tier||'')} · 원인 아님)</span>`).join(' · ')}</div>`;
        return out;
      })()}
      <div class="rngbar">${picker}<span class="rng-n">${
        p.zoom ? `확대 ${zc.series.length}일 · 그래프 더블클릭으로 복귀`
                  : `${c.series.length}일${d.total_days ? ` / 전체 ${d.total_days}일` : ''} · 드래그하면 확대`
      }</span></div>
    </div>

    <div class="card">
      <div class="chart-acts">
        <button data-png title="그래프+현재값을 PNG로 저장">⬇ PNG</button>
        <button data-copy title="현재값을 텍스트로 복사">📋 복사</button>
      </div>
      <div class="nums">
        ${num('현재값', det.current_value ?? c.series.at(-1).value)}
        ${num('정상값', c.baseline_median, 'var(--ink-muted)')}
        ${num('관리하한', c.control_lsl, c.score_side !== 'upper' ? 'var(--critical)' : 'var(--ink-faint)')}
        ${num('관리상한', c.control_usl, c.score_side !== 'lower' ? 'var(--critical)' : 'var(--ink-faint)')}
        ${num('Health Index', det.health_index, hiColor(det.health_index))}
      </div>
      ${margin == null ? '' : `
        <div class="gauge-l">여유 소진 ${margin}%</div>
        <div class="gauge"><div class="gauge-fill" style="width:${Math.min(margin,100)}%;
          background:${margin >= 80 ? 'var(--critical)' : margin >= 40 ? 'var(--warn)' : 'var(--good)'}"></div></div>
        <div class="gauge-ax"><span>0% 정상값</span><span>100% 관리한계</span></div>`}
      ${renderChart(zc, meta.threshold_raw)}
      <div class="meta">
        ${c.early_warning_active && c.alert_since
          ? `경보 <b>${c.alert_active_days}일째</b> (${c.alert_since}부터)`
            + (c.alert_level === 'full'
                ? ` <span style="color:var(--critical)">— 점수에 최대폭 반영됨</span>`
                : ` <span style="color:var(--ink-faint)">— 초기 경보라 점수를 거의 안 깎았다</span>`)
          : '추세 경보 없음'}
        ${det.defect_zone_rate_pct != null
          ? ` · 위험구간 진입률 <b>${det.defect_zone_rate_pct}%</b> <span style="color:var(--ink-faint)">(평소 ${det.defect_zone_baseline_pct}%)</span>` : ''}
        ${det.estimated_days_to_control_limit != null
          ? ` · 이 추세면 <b>${det.estimated_days_to_control_limit}일</b> 뒤 관리한계 도달` : ''}
        ${meta.mechanism ? `<br>메커니즘 <code>${esc(meta.mechanism)}</code>` : ''}
      </div>
      ${renderRiskBand(meta, det, d.defect, d.factor)}
    </div>`;

  p.body.querySelectorAll('.rng').forEach(el => el.onclick = () =>
    setPaneDays(p, el.dataset.days ? Number(el.dataset.days) : null));
  // 툴팁이 인덱스로 값을 찾으므로, 화면에 실제로 그린 구간(zc)을 넘겨야 어긋나지 않는다
  wireChart({...d, chart: zc}, p);
}

// "불량률이 갈리는 경계값"을 보여준다.
//
// 판정 기준은 **선 하나**(threshold_raw)다. risky_range/normal_range는 기준이 아니라
// 각 쪽에 떨어진 샷들이 실제로 놓인 범위(p5~p95)이고, 양쪽 꼬리 5%씩을 잘라낸 값이라
// 두 범위 사이에 빈 구간이 생긴다. 예전엔 두 범위만 색칠해서 그 빈 구간이 "중립지대"처럼
// 읽혔다 — 경계선을 같이 그리고, 범위가 무엇인지 글로 밝힌다.
function renderRiskBand(meta, det, defect, factor){
  const parse = s => {
    const m = String(s || '').match(/(-?[\d.]+)\s*~\s*(-?[\d.]+)/);
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
  };
  const risky = parse(meta.risky_range), normal = parse(meta.normal_range);
  if(!risky || !normal) return '';

  const now = det.current_value, thr = meta.threshold_raw;
  const riskyIsAbove = risky[0] > normal[0];
  const crossed = (now != null && thr != null) && (riskyIsAbove ? now > thr : now < thr);
  const nR = meta.rate_in_risky_pct, nN = meta.rate_in_normal_pct;
  const rate = v => v == null ? '—' : `${v}%`;

  // 경계까지 남은 거리 — "아직 안 넘음"만으로는 여유가 큰지 코앞인지 알 수 없다.
  const gap = (now != null && thr != null) ? Math.abs(now - thr) : null;
  const digits = String(thr ?? '').split('.')[1]?.length ?? 3;
  const op = riskyIsAbove ? '≥' : '≤';

  return `<div class="band">
    <div class="band-h">${defect ? `${defect} ` : ''}위험구간 — <b style="color:var(--ink)">${esc(factor || '')} ${op} ${thr ?? '—'}</b></div>
    <table class="dtable">
      <thead><tr><th>구분</th><th>실측범위 (p5~p95)</th><th>${defect ? defect + ' ' : ''}불량률</th></tr></thead>
      <tbody>
        <tr>
          <td><span class="swatch" style="background:var(--critical)"></span>위험구간</td>
          <td>${meta.risky_range}</td><td class="hot">${rate(nR)}</td>
        </tr>
        <tr>
          <td><span class="swatch" style="background:var(--good)"></span>정상구간</td>
          <td>${meta.normal_range}</td><td>${rate(nN)}</td>
        </tr>
        ${now == null ? '' : `<tr class="nowrow">
          <td><span class="swatch" style="background:var(--ink)"></span>현재값</td>
          <td>${now}</td><td>${crossed
            ? `<span style="color:var(--critical);font-weight:600">진입 (${gap != null ? gap.toFixed(digits) + ' 초과' : ''})</span>`
            : `미진입${gap != null ? ` · 경계까지 ${gap.toFixed(digits)}` : ''}`}</td>
        </tr>`}
      </tbody>
    </table>
    <div class="band-foot">
      ${meta.risk_ratio ? `위험구간 불량률이 정상구간의 <b>${meta.risk_ratio}배</b>. ` : ''}실측범위는 판정 기준이 아니라 각 구간에 떨어진 샷의 분포(양끝 5%씩 제외) — 판정은 경계값 하나로 한다.
    </div>
  </div>`;
}

// 이전 화면(chat.html)의 렌더러를 이식한 것 — 관리한계/스펙 두 축 구분, 짝지어진 defect
// 불량률 겹쳐 그리기, 경보 시작 세로선은 이 데이터에만 있는 요구라 검증된 코드를 유지한다.
// 26.08.11에 chat.html을 지우면서 이 함수가 그래프 렌더러의 유일한 사본이 됐다.
function renderChart(cd, threshold){
  const W=640,H=210,padL=52,padR=16,padT=14,padB=26;
  const n=cd.series.length; if(n<2) return '';
  const has=v=>v!==null&&v!==undefined;
  const values=cd.series.map(p=>p.value);
  const hasLsl=has(cd.control_lsl), hasUsl=has(cd.control_usl);
  const side=cd.score_side||'both';
  const scoresUp=side==='both'||side==='upper', scoresLo=side==='both'||side==='lower';
  // 불량이 갈리는 경계값은 시계열과 같은 단위라 이 그래프 위에 그대로 그릴 수 있다 —
  // 값이 그 선을 언제 넘나드는지가 한눈에 보여야 표로 읽는 것보다 낫다.
  const hasThr=has(threshold);
  const allVals=values.concat([cd.baseline_median], hasLsl?[cd.control_lsl]:[], hasUsl?[cd.control_usl]:[],
                              hasThr?[threshold]:[]);
  let vMin=Math.min(...allVals), vMax=Math.max(...allVals);
  const pad=(vMax-vMin)*0.08||Math.abs(vMax)*0.05||1; vMin-=pad; vMax+=pad;
  const x=i=>padL+(i/(n-1))*(W-padL-padR);
  const y=v=>padT+(1-(v-vMin)/(vMax-vMin))*(H-padT-padB);
  const linePath=cd.series.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const last=cd.series[n-1];

  // (26.08.11) 하류 defect가 여러 개면 전부 겹쳐 그린다 — 한 원인이 두 불량을 미는 걸
  // 눈으로 보이게 하는 게 목적이라 우축(비율) 스케일은 **공유**한다. 각자 최댓값으로
  // 정규화하면 둘 다 같은 높이로 그려져서 어느 쪽이 큰지가 사라진다.
  const dSets=(cd.defects&&cd.defects.length ? cd.defects
              : (cd.defect_series ? [{defect:cd.defect, series:cd.defect_series, alert_usable:true}] : []))
              .filter(s=>s.series&&s.series.length===n&&s.series.some(p=>has(p.value)));
  let defectArea='';
  if(dSets.length){
    const dMax=Math.max(...dSets.flatMap(s=>s.series.map(p=>p.value).filter(has)));
    if(dMax>0){
      const dTop=padT+(H-padT-padB)*0.60, dBot=H-padB;
      const dy=v=>dBot-(v/dMax)*(dBot-dTop);
      const COLORS=['var(--warn)','var(--accent)'];
      const labels=[];
      dSets.forEach((s,si)=>{
        const col=COLORS[si%COLORS.length];
        const pts=s.series.map((p,i)=>has(p.value)?`${x(i).toFixed(1)},${dy(p.value).toFixed(1)}`:null).filter(Boolean);
        if(pts.length<2) return;
        // 첫 계열만 면으로 채운다 — 둘 다 채우면 겹쳐서 둘 다 안 읽힌다.
        if(si===0) defectArea+=`<polygon points="${x(0).toFixed(1)},${dBot} ${pts.join(' ')} ${x(n-1).toFixed(1)},${dBot}" fill="${col}" opacity="0.16"/>`;
        defectArea+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.8"${s.alert_usable===false?' stroke-dasharray="3 2"':''}/>`;
        // 경계값으로 경보를 못 거는 짝은 점선 — 관계는 인정됐지만(tier) 이 선을 근거로
        // 경보를 걸지는 않는다는 표시다. 실측 불량률 자체는 사실이므로 그린다.
        labels.push(`<tspan fill="${col}">${s.defect}${s.alert_usable===false?'(위험구간 기준 없음)':''}</tspan>`);
      });
      if(defectArea) defectArea+=`<text x="${padL+2}" y="${(dTop-3).toFixed(1)}" font-size="8.5">`
        +labels.join('<tspan fill="var(--ink-faint)"> · </tspan>')
        +`<tspan fill="var(--ink-faint)"> 불량률 (우축 최대 ${(dMax*100).toFixed(2)}%)</tspan></text>`;
    }
  }
  const hline=(v,color,dashed)=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="${color}" stroke-width="1"${dashed?' stroke-dasharray="4 3"':''}/>`;
  const inRange=v=>has(v)&&v>=vMin&&v<=vMax;
  const specLine=(v,label)=>inRange(v)
    ? `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="2 4"/>`
      +`<text x="${padL+2}" y="${(y(v)-3).toFixed(1)}" font-size="8.5" fill="var(--ink-faint)">${label} ${v}</text>` : '';
  const specLines=String(cd.spec_source||'').startsWith('mentor_spec')
    ? specLine(cd.usl,'스펙USL')+specLine(cd.lsl,'스펙LSL') : '';
  let alertMark='';
  if(cd.alert_since){
    const ai=cd.series.findIndex(p=>p.date>=cd.alert_since);
    if(ai>0){
      const ax=x(ai).toFixed(1);
      alertMark=`<line x1="${ax}" y1="${padT}" x2="${ax}" y2="${H-padB}" stroke="var(--critical)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>`
        +`<text x="${(x(ai)+3).toFixed(1)}" y="${padT+9}" font-size="8.5" fill="var(--critical)">경보 ${cd.alert_since}</text>`;
    }
  }
  // 크로스헤어·툴팁이 마우스 x를 시리즈 인덱스로 되돌리려면 이 좌표계가 필요하다.
  // 렌더 시점의 값을 그대로 실어 보내면 상호작용 코드가 계산을 다시 하지 않아도 되고,
  // 기간이 바뀌어 다시 그려질 때 자동으로 갱신된다.
  const geom = JSON.stringify({W,H,padL,padR,padT,padB,n,vMin,vMax,kind:'single'});

  return `<div class="chart"><svg class="ix" data-geom='${geom}' viewBox="0 0 ${W} ${H}">
    ${defectArea}${specLines}${alertMark}
    ${hasUsl?hline(cd.control_usl,scoresUp?'var(--critical)':'var(--ink-faint)',true):''}
    ${hasLsl?hline(cd.control_lsl,scoresLo?'var(--critical)':'var(--ink-faint)',true):''}
    ${hline(cd.baseline_median,'var(--ink-faint)',false)}
    ${hasThr?`<line x1="${padL}" y1="${y(threshold).toFixed(1)}" x2="${W-padR}" y2="${y(threshold).toFixed(1)}" stroke="var(--warn)" stroke-width="1.4"/>`
      +`<text x="${padL+2}" y="${(y(threshold)-4).toFixed(1)}" font-size="8.5" fill="var(--warn)">불량 경계 ${threshold}</text>`:''}
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.2" fill="var(--accent)"/>
    <text x="${padL}" y="${H-6}" font-size="9" fill="var(--ink-faint)">${cd.series[0].date}</text>
    <text x="${W-padR}" y="${H-6}" font-size="9" fill="var(--ink-faint)" text-anchor="end">${last.date}</text>
    ${hasUsl?`<text x="${W-padR}" y="${(y(cd.control_usl)-4).toFixed(1)}" font-size="9" fill="${scoresUp?'var(--critical)':'var(--ink-faint)'}" text-anchor="end">관리상한 ${cd.control_usl}</text>`:''}
    ${hasLsl?`<text x="${W-padR}" y="${(y(cd.control_lsl)+11).toFixed(1)}" font-size="9" fill="${scoresLo?'var(--critical)':'var(--ink-faint)'}" text-anchor="end">관리하한 ${cd.control_lsl}</text>`:''}
    <text x="${W-padR}" y="${(y(cd.baseline_median)-4).toFixed(1)}" font-size="9" fill="var(--ink-faint)" text-anchor="end">정상값 ${cd.baseline_median}</text>
  </svg></div>`;
}

// ===================================================================
// 뷰 2 — 실제 불량 발생. Health Index(조짐)와 축이 다르므로 뷰를 분리했다.
// ===================================================================
function renderDefect(d, p){
  const W=640,H=250,padL=46,padR=14,padT=14,padB=44;
  const n=d.dates.length;
  const flat=d.series.flatMap(s=>s.values).filter(v=>v!=null);
  const vMax=Math.max(...flat,0.001)*1.1;
  const x=i=>padL+(i/(n-1))*(W-padL-padR);
  const y=v=>padT+(1-v/vMax)*(H-padT-padB);

  const paths=d.series.map(s=>{
    const color=DEFECT_COLORS[s.defect]||'var(--ink-muted)';
    let path='',pen=false;
    s.values.forEach((v,i)=>{
      if(v==null){pen=false;return;}
      path+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen=true;
    });
    return `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.9"/>`;
  }).join('');

  const legend=d.series.map((s,i)=>{
    const color=DEFECT_COLORS[s.defect]||'var(--ink-muted)';
    const lx=padL+i*146;
    return `<line x1="${lx}" y1="${H-12}" x2="${lx+13}" y2="${H-12}" stroke="${color}" stroke-width="2.5"/>`
      +`<text x="${lx+17}" y="${H-9}" font-size="9.5" fill="var(--ink-muted)">${s.defect} 평균 ${s.mean_pct}%</text>`;
  }).join('');

  // 감시 수단이 없는 defect는 빈칸으로 두지 않고 명시한다 — 가짜 100점보다 정직하다.
  const noWatch=d.series.filter(s=>!s.usable_factors.length);
  // 기간 선택 — 89일 전체를 늘 보면 최근 변화가 뭉개진다. state.days로 서버에 넘긴다.
  const ranges = [[null,'전체'],[30,'최근 30일'],[7,'최근 7일']];
  const picker = ranges.map(([v,label]) =>
    `<span class="rng ${(p.state.days ?? null) === v ? 'on' : ''}" data-days="${v ?? ''}">${label}</span>`).join('');

  p.body.innerHTML=`
    <div class="vhead">
      <div class="vtitle">${d.machine} · 실제 불량 발생</div>
      <div class="vsub">Health Index(터지기 전 조짐)와 분리된 축입니다</div>
      <div class="rngbar">${picker}<span class="rng-n">${d.dates.length}일 / 전체 ${d.total_days}일</span></div>
    </div>
    <div class="card">
      <div class="chart-t">일별 불량률 (%)</div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}">
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--border)"/>
        <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--border)"/>
        <text x="${padL-6}" y="${padT+4}" font-size="9" fill="var(--ink-faint)" text-anchor="end">${vMax.toFixed(1)}%</text>
        <text x="${padL-6}" y="${H-padB}" font-size="9" fill="var(--ink-faint)" text-anchor="end">0</text>
        ${paths}
        <text x="${padL}" y="${H-28}" font-size="9" fill="var(--ink-faint)">${d.dates[0]}</text>
        <text x="${W-padR}" y="${H-28}" font-size="9" fill="var(--ink-faint)" text-anchor="end">${d.dates.at(-1)}</text>
        ${legend}
      </svg></div>
      ${noWatch.length ? `<div class="note"><b>감시 수단 없음</b> — ${noWatch.map(s=>s.defect).join(', ')}은 관계DB에 경보로 쓸 수 있는 원인 인자가 없습니다. 불량은 실제로 나고 있지만 Health Index로는 미리 잡히지 않습니다.</div>` : ''}
      <div class="meta">${d.series.map(s=>`${s.defect} 최대 <b>${s.max_pct}%</b>`).join(' · ')}</div>
    </div>`;

  p.body.querySelectorAll('.rng').forEach(el => el.onclick = () =>
    setPaneDays(p, el.dataset.days ? Number(el.dataset.days) : null));
}

// ===================================================================
// 뷰 3 — Product×Recipe 히트맵. 장비는 격자에 안 넣는다(216칸이 되면 못 읽는다).
// ===================================================================
function renderHeatmap(d, p){
  // 색 눈금 천장은 이 변수의 4대 공통 최댓값이다 — 장비를 바꿔가며 봤을 때 색이
  // 비교 가능해야 한다(장비별 최댓값으로 정규화하면 어느 장비든 격자가 새빨개진다).
  const max=d.scale_max||d.max||1;
  const cells=d.products.map((p,i)=>{
    const row=`<div class="hm-lab row">${p}</div>` + d.recipes.map((r,j)=>{
      const v=d.rows[i][j];
      if(v==null) return `<div class="hm-cell" style="background:var(--surface-2);color:var(--ink-faint)">–</div>`;
      const t=Math.round((v/max)*100);
      return `<div class="hm-cell" title="${p} × ${r} — ${v}%"
        style="background:color-mix(in srgb, var(--critical) ${t}%, var(--surface-2));
               color:${t>55?'#fff':'var(--ink)'}">${v}</div>`;
    }).join('');
    return row;
  }).join('');
  const header=`<div class="hm-lab"></div>` + d.recipes.map(r=>`<div class="hm-lab">${r.replace('RCP_','R')}</div>`).join('');

  p.body.innerHTML=`
    <div class="vhead">
      <div class="vtitle">${d.machine} · ${d.factor}</div>
      <div class="vsub">Product × Recipe 조합별 ${d.unit}</div>
    </div>
    <div class="card">
      <div class="hm" style="grid-template-columns:64px repeat(${d.recipes.length}, 1fr)">
        ${header}${cells}
      </div>
      <div class="legend">
        <span>0%</span><span class="legend-bar"></span><span>${max}%</span>
        <span style="margin-left:10px">이 장비 최고 ${d.max}% · 평균 ${d.mean}%</span>
        <span style="margin-left:auto;color:var(--ink-faint)">눈금은 4대 공통</span>
      </div>
      <div class="note">
        ${d.concentrated
          ? `<b>${d.hotspot.product} × ${d.hotspot.recipe}</b>에 집중돼 있습니다 (${d.hotspot.value}%, 평균의 ${(d.hotspot.value/d.mean).toFixed(1)}배) — 이 조합을 점검 대상으로 지목할 수 있습니다.`
          : `특정 조합에 몰려 있지 않고 <b>${d.products.length * d.recipes.length}개 조합 전반</b>에 고르게 퍼져 있습니다 (최고 ${d.max}% / 평균 ${d.mean}%) — 레시피 문제가 아니라 설비·공정 전반의 문제로 읽어야 합니다.`}
      </div>
    </div>`;
}

// ===================================================================
// 뷰 4 — 장비 비교. 기준선은 4대 공통이다(baseline이 Product×Recipe 층에서 잡히므로).
// ===================================================================
function renderCompare(d, p){
  d = zoomedCompare(d, p.zoom);   // 드래그로 확대 중이면 그 구간만 — 아래 전부가 이걸 쓴다
  const W=640,H=250,padL=52,padR=16,padT=14,padB=44;
  const n=d.dates.length;
  const has=v=>v!==null&&v!==undefined;
  const flat=d.machines.flatMap(m=>m.values).filter(has);
  const allVals=flat.concat([d.baseline_median], has(d.control_lsl)?[d.control_lsl]:[], has(d.control_usl)?[d.control_usl]:[]);
  let vMin=Math.min(...allVals), vMax=Math.max(...allVals);
  const pad=(vMax-vMin)*0.08||Math.abs(vMax)*0.05||1; vMin-=pad; vMax+=pad;
  const x=i=>padL+(i/(n-1))*(W-padL-padR);
  const y=v=>padT+(1-(v-vMin)/(vMax-vMin))*(H-padT-padB);
  const hline=(v,color,dashed)=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="${color}" stroke-width="1"${dashed?' stroke-dasharray="4 3"':''}/>`;
  const side=d.score_side||'both';
  const scoresUp=side==='both'||side==='upper', scoresLo=side==='both'||side==='lower';

  const paths=d.machines.map(m=>{
    const color=MACHINE_COLORS[m.machine_id]||'var(--ink-muted)';
    let path='',pen=false,lastI=-1;
    m.values.forEach((v,i)=>{
      if(!has(v)){pen=false;return;}
      path+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen=true; lastI=i;
    });
    const dot=lastI>=0?`<circle cx="${x(lastI).toFixed(1)}" cy="${y(m.values[lastI]).toFixed(1)}" r="3" fill="${color}"/>`:'';
    return `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.9"/>${dot}`;
  }).join('');

  const legend=d.machines.map((m,i)=>{
    const color=MACHINE_COLORS[m.machine_id]||'var(--ink-muted)';
    const lx=padL+i*128;
    return `<line x1="${lx}" y1="${H-12}" x2="${lx+13}" y2="${H-12}" stroke="${color}" stroke-width="2.5"/>`
      // 경보 지속일은 사이드바 배지와 같은 표기·같은 무게로 쓴다 — 같은 사실을 두 화면이
      // 다르게 그리면 어느 쪽을 믿어야 할지 알 수 없다. 빨강은 full 경보에만.
      +`<text x="${lx+17}" y="${H-9}" font-size="9.5" fill="var(--ink-muted)">${m.machine_id}</text>`
      +(m.alert_active_days==null ? ''
        : `<text x="${lx+17+m.machine_id.length*6.2}" y="${H-9}" font-size="9.5"
                 fill="${m.alert_level==='full'?'var(--critical)':'var(--ink-faint)'}"> 경보 ${alertDays(m.alert_active_days)}</text>`);
  }).join('');

  p.body.innerHTML=`
    <div class="vhead">
      <div class="vtitle">${d.factor} · 장비 4대 비교</div>
      <div class="vsub">기준선은 4대 공통입니다 — 같은 자로 재서 어느 장비가 벗어났는지 봅니다</div>
      <div class="rngbar"><span class="rng-n">${
        p.zoom ? `확대 ${n}일 · 그래프 더블클릭으로 복귀` : `${n}일 · 드래그하면 확대`}</span></div>
    </div>
    <div class="card">
      <div class="chart-acts">
        <button data-png title="그래프를 PNG로 저장">⬇ PNG</button>
        <button data-copy title="현재값을 텍스트로 복사">📋 복사</button>
      </div>
      <div class="chart"><svg class="ix" data-geom='${JSON.stringify({W,H,padL,padR,padT,padB,n,vMin,vMax,kind:'compare'})}' viewBox="0 0 ${W} ${H}">
        ${has(d.control_usl)?hline(d.control_usl,scoresUp?'var(--critical)':'var(--ink-faint)',true):''}
        ${has(d.control_lsl)?hline(d.control_lsl,scoresLo?'var(--critical)':'var(--ink-faint)',true):''}
        ${hline(d.baseline_median,'var(--ink-faint)',false)}
        ${paths}
        <text x="${padL}" y="${H-28}" font-size="9" fill="var(--ink-faint)">${d.dates[0]}</text>
        <text x="${W-padR}" y="${H-28}" font-size="9" fill="var(--ink-faint)" text-anchor="end">${d.dates.at(-1)}</text>
        ${has(d.control_usl)?`<text x="${W-padR}" y="${(y(d.control_usl)-4).toFixed(1)}" font-size="9" fill="${scoresUp?'var(--critical)':'var(--ink-faint)'}" text-anchor="end">관리상한 ${d.control_usl}</text>`:''}
        ${has(d.control_lsl)?`<text x="${W-padR}" y="${(y(d.control_lsl)+11).toFixed(1)}" font-size="9" fill="${scoresLo?'var(--critical)':'var(--ink-faint)'}" text-anchor="end">관리하한 ${d.control_lsl}</text>`:''}
        <text x="${W-padR}" y="${(y(d.baseline_median)-4).toFixed(1)}" font-size="9" fill="var(--ink-faint)" text-anchor="end">정상값 ${d.baseline_median}</text>
        ${legend}
      </svg></div>
    </div>`;

  wireChart(d, p);
}

// ===================================================================
// 그래프 위에서 값 읽기 + 내보내기
//
// 그래프는 SVG 문자열로 만들어지므로, 렌더가 끝난 뒤 여기서 상호작용 레이어를
// 얹는다. 좌표계는 renderChart/renderCompare가 svg의 data-geom에 실어 보낸 값을
// 그대로 쓴다 — 같은 계산을 두 곳에서 하면 기간이 바뀔 때 어긋난다.
// ===================================================================
const SVGNS = 'http://www.w3.org/2000/svg';
const hideTip = () => { $('chartTip').style.display = 'none'; };

// 드래그로 고른 확대 구간 — **이미 받아온 시리즈 안의 인덱스**다. 서버를 다시
// 부르지 않고 화면에서만 잘라서 즉시 반응한다(기간 버튼은 서버 왕복이라 성격이
// 다르다 — 버튼은 "얼마나 받아올지", 드래그는 "받아온 것 중 어디를 볼지").
// 다른 변수/장비를 고르거나 기간 버튼을 누르면 load()에서 풀린다.
// 확대 구간은 패널마다 따로다(p.zoom) — 한쪽은 7일, 한쪽은 전체를 볼 수 있어야 비교가 된다.
const zoomSlice = (arr, z) => z ? arr.slice(z.from, z.to + 1) : arr;

function zoomedChart(c, z){
  if(!z) return c;
  const out = {...c, series: zoomSlice(c.series, z)};
  if(c.defect_series) out.defect_series = zoomSlice(c.defect_series, z);
  return out;
}
function zoomedCompare(d, z){
  if(!z) return d;
  return {...d, dates: zoomSlice(d.dates, z),
          machines: d.machines.map(m => ({...m, values: zoomSlice(m.values, z)}))};
}
// 기간 버튼은 그 패널만 바꾼다 — 고정된 패널도 기간은 바꿔볼 수 있어야 한다.
function setPaneDays(p, days){
  p.state.days = days;
  if(!p.pinned) syncGlobalUI();
  loadPane(p);
}

function fmtNum(v){
  if(v === null || v === undefined) return '-';
  const a = Math.abs(v);
  return a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(3) : v.toFixed(4);
}

// 정상값에서 "점수를 내는 쪽" 관리한계까지 여유를 얼마나 썼는지. 카드의 게이지와
// 같은 개념(margin_used_pct)이라 툴팁 숫자와 게이지가 어긋나지 않는다.
function marginPct(cd, v){
  const b = cd.baseline_median, side = cd.score_side || 'both';
  if(b == null || v == null) return null;
  const bound = side === 'upper' ? cd.control_usl
              : side === 'lower' ? cd.control_lsl
              : (v >= b ? cd.control_usl : cd.control_lsl);
  if(bound == null || bound === b) return null;
  return Math.max(0, (v - b) / (bound - b)) * 100;
}

const tpRow = (k, v, color) =>
  `<div class="tp-r">${color ? `<span class="tp-s" style="background:${color}"></span>` : ''}` +
  `<span class="tp-k">${k}</span><span class="tp-v">${v}</span></div>`;

function buildTip(d, i){
  const cmp = d.view === 'compare';
  const cd = cmp ? d : d.chart;
  const dates = cmp ? d.dates : cd.series.map(p => p.date);
  let h = `<div class="tp-d">${dates[i]}</div>`;
  if(cmp){
    for(const m of d.machines){
      const color = MACHINE_COLORS[m.machine_id] || 'var(--ink-muted)';
      h += tpRow(m.machine_id + (m.alert_active_days != null ? ' ⚠' : ''), fmtNum(m.values[i]), color);
    }
  } else {
    const v = cd.series[i].value;
    h += tpRow(d.factor, fmtNum(v), 'var(--accent)');
    const mp = marginPct(cd, v);
    if(mp !== null) h += tpRow('여유 소진', mp.toFixed(0) + '%');
    const ds = cd.defect_series && cd.defect_series[i];
    if(ds && ds.value != null) h += tpRow(cd.defect + ' 불량률', (ds.value * 100).toFixed(2) + '%', 'var(--warn)');
  }
  h += tpRow('정상값', fmtNum(cd.baseline_median));
  const side = cd.score_side || 'both';
  if(cd.control_usl != null && (side === 'both' || side === 'upper')) h += tpRow('관리상한', fmtNum(cd.control_usl));
  if(cd.control_lsl != null && (side === 'both' || side === 'lower')) h += tpRow('관리하한', fmtNum(cd.control_lsl));
  const since = cmp ? d.machines.map(m => m.alert_since).filter(Boolean).sort()[0] : cd.alert_since;
  if(since && dates[i] >= since){
    h += `<div class="tp-r"><span class="tp-k" style="color:var(--critical)">경보 ${since}부터 지속 구간</span></div>`;
  }
  return h;
}

function attachCrosshair(svg, d, p){
  let geom;
  try{ geom = JSON.parse(svg.dataset.geom || '{}'); }catch(_){ return; }
  if(!geom.n || geom.n < 2) return;

  const cmp = d.view === 'compare', cd = cmp ? d : d.chart;
  const targets = cmp ? d.machines : [null];
  const plotW = geom.W - geom.padL - geom.padR;
  const xOf = i => geom.padL + (i / (geom.n - 1)) * plotW;
  const yOf = v => geom.padT + (1 - (v - geom.vMin) / (geom.vMax - geom.vMin)) * (geom.H - geom.padT - geom.padB);
  // 화면 x -> viewBox x.
  //
  // getBoundingClientRect().width로 나누면 안 된다. svg는 CSS width:100%인데
  // height가 210으로 고정돼 있어서, 카드가 640보다 넓으면 preserveAspectRatio
  // 기본값(xMidYMid meet)이 배율을 1로 묶고 그림을 **가운데 640px에만** 그린다
  // (카드 1444px이면 좌우 402px씩이 빈 공간). 요소 폭 기준으로 환산하면 그 빈
  // 공간에서도 툴팁이 뜨고, 위치도 실제 점과 어긋난다.
  // getScreenCTM()은 실제로 적용된 변환이라 여백·배율과 무관하게 맞는다.
  const vbX = cx => {
    const ctm = svg.getScreenCTM();
    if(!ctm) return null;                       // 아직 배치 전(폭 0 등)
    const pt = svg.createSVGPoint();
    pt.x = cx; pt.y = 0;
    return pt.matrixTransform(ctm.inverse()).x;
  };
  const idxAt = cx => {
    const vx = vbX(cx);
    if(vx === null) return -1;
    // 그림 밖(좌우 여백, 축 라벨 영역)에서는 아무것도 띄우지 않는다
    if(vx < geom.padL - 6 || vx > geom.W - geom.padR + 6) return -1;
    return Math.max(0, Math.min(geom.n - 1, Math.round((vx - geom.padL) / plotW * (geom.n - 1))));
  };

  // data-ui 표시를 달아둔다 — PNG로 내보낼 때 골라서 빼기 위함(마우스 흔적이
  // 저장 이미지에 남으면 안 된다).
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('data-ui', '1');
  g.setAttribute('pointer-events', 'none');
  g.style.display = 'none';
  const vline = document.createElementNS(SVGNS, 'line');
  vline.setAttribute('stroke', 'var(--ink-muted)');
  vline.setAttribute('stroke-width', '1');
  vline.setAttribute('stroke-dasharray', '3 3');
  vline.setAttribute('y1', geom.padT);
  vline.setAttribute('y2', geom.H - geom.padB);
  g.appendChild(vline);
  const dots = targets.map(m => {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', '3.6');
    c.setAttribute('fill', m ? (MACHINE_COLORS[m.machine_id] || 'var(--ink-muted)') : 'var(--accent)');
    c.setAttribute('stroke', 'var(--surface)');
    c.setAttribute('stroke-width', '1.3');
    g.appendChild(c);
    return c;
  });
  svg.appendChild(g);

  // 드래그로 고른 구간을 표시할 사각형
  const sel = document.createElementNS(SVGNS, 'rect');
  sel.setAttribute('data-ui', '1');
  sel.setAttribute('fill', 'var(--accent)');
  sel.setAttribute('opacity', '0.16');
  sel.setAttribute('y', geom.padT);
  sel.setAttribute('height', geom.H - geom.padT - geom.padB);
  sel.setAttribute('pointer-events', 'none');
  sel.style.display = 'none';
  svg.appendChild(sel);

  svg.style.touchAction = 'none';
  let dragging = false, dragStart = 0;
  const clearHover = () => { g.style.display = 'none'; hideTip(); };

  svg.addEventListener('pointermove', e => {
    const i = idxAt(e.clientX);
    if(i < 0){ if(!dragging) clearHover(); return; }
    if(dragging){
      const a = Math.min(dragStart, i), b = Math.max(dragStart, i);
      sel.setAttribute('x', xOf(a));
      sel.setAttribute('width', Math.max(1, xOf(b) - xOf(a)));
      return;
    }
    const px = xOf(i);
    vline.setAttribute('x1', px); vline.setAttribute('x2', px);
    targets.forEach((m, k) => {
      const v = m ? m.values[i] : cd.series[i].value;
      if(v == null){ dots[k].style.display = 'none'; return; }
      dots[k].style.display = '';
      dots[k].setAttribute('cx', px);
      dots[k].setAttribute('cy', yOf(v));
    });
    g.style.display = '';
    const tip = $('chartTip');
    tip.innerHTML = buildTip(d, i);
    tip.style.display = 'block';
    // 화면 밖으로 넘치면 반대편으로 접는다
    let left = e.clientX + 16, top = e.clientY - tip.offsetHeight - 12;
    if(left + tip.offsetWidth > window.innerWidth - 8) left = e.clientX - tip.offsetWidth - 16;
    if(top < 8) top = e.clientY + 20;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = top + 'px';
  });
  svg.addEventListener('pointerleave', () => { if(!dragging) clearHover(); });

  // 드래그 확대 — 서버를 다시 부르지 않고 이미 받은 구간 안에서 잘라 본다.
  // 포인터 캡처를 걸어서 그래프 밖에서 손을 떼도 확대가 성립하게 한다.
  svg.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    const i = idxAt(e.clientX);
    if(i < 0) return;
    e.preventDefault();
    dragging = true; dragStart = i;
    sel.setAttribute('x', xOf(i)); sel.setAttribute('width', '0');
    sel.style.display = '';
    clearHover();
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  });
  svg.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging = false;
    sel.style.display = 'none';
    try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
    const i = idxAt(e.clientX);
    if(i < 0) return;
    const a = Math.min(dragStart, i), b = Math.max(dragStart, i);
    if(b - a < 1) return;                      // 그냥 클릭 — 확대하지 않는다
    // 지금 보이는 구간의 인덱스를 원본(로드된 시리즈) 인덱스로 되돌린다
    const base = p.zoom ? p.zoom.from : 0;
    p.zoom = {from: base + a, to: base + b};
    paintPane(p);
  });
  svg.addEventListener('dblclick', e => {
    e.stopPropagation();
    if(p.zoom){ p.zoom = null; paintPane(p); }
  });
}

// ---------- 내보내기 ----------
const PNG_FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const cssVar = (n, fb) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
const fileSafe = s => String(s).replace(/[\p{Extended_Pictographic}️]/gu, '')
  .replace(/[\\/:*?"<>|]/g, '').replace(/[·]/g, '-').replace(/\s+/g, '_')
  .replace(/^[_\-]+|[_\-]+$/g, '').slice(0, 80) || 'chart';

function chartSummaryText(d){
  if(d.view === 'compare'){
    const rows = d.machines.map(m => {
      const v = [...m.values].reverse().find(x => x != null);
      return `- ${m.machine_id}: ${fmtNum(v)}` +
             (m.alert_active_days != null ? ` (경보 ${m.alert_active_days}일째)` : '');
    }).join('\n');
    return `## ${d.factor} · 장비 4대 비교\n\n`
      + `- 정상값: ${d.baseline_median}\n- 관리한계: ${d.control_lsl} ~ ${d.control_usl}\n${rows}\n\n`
      + `기간: ${d.dates[0]} ~ ${d.dates.at(-1)} (${d.dates.length}일)\n`;
  }
  const c = d.chart, det = d.detail || {}, meta = d.meta || {};
  const L = [`## ${d.machine} · ${d.factor}`, ''];
  // 화면(vhead)과 같은 출처를 쓴다 — 한 인자에 defect가 둘인 경우가 실제로 있어서
  // d.defect 하나만 적으면 복사본이 화면보다 적게 나간다.
  const rel = d.related_defects || (d.defect ? [{defect: d.defect, is_cause: true}] : []);
  const cause = rel.filter(r => r.is_cause), cand = rel.filter(r => !r.is_cause);
  if(cause.length) L.push(`- ${meta.actionable === false ? '감시지표' : '원인'} → ${cause.map(r => r.defect).join(' · ')}`);
  if(cand.length) L.push(`- 감시 후보 → ${cand.map(r => `${r.defect} (${r.tier || ''} · 원인 아님)`).join(' · ')}`);
  L.push(`- 현재값: ${det.current_value ?? c.series.at(-1).value} (정상값 ${c.baseline_median})`);
  if(c.control_lsl != null || c.control_usl != null) L.push(`- 관리한계: ${c.control_lsl} ~ ${c.control_usl}`);
  if(det.health_index != null) L.push(`- Health Index: ${det.health_index}`);
  if(det.margin_used_pct != null) L.push(`- 여유 소진: ${det.margin_used_pct}%`);
  if(meta.action_type) L.push(`- 조치 긴급도: ${meta.action_type} (tier ${meta.tier ?? '-'})`);
  if(c.early_warning_active && c.alert_since) L.push(`- 경보: ${c.alert_since}부터 ${c.alert_active_days}일째 지속`);
  if(det.estimated_days_to_control_limit != null) L.push(`- 이 추세면 ${det.estimated_days_to_control_limit}일 뒤 관리한계 도달`);
  if(meta.mechanism) L.push(`- 메커니즘: ${meta.mechanism}`);
  L.push('', `기간: ${c.series[0].date} ~ ${c.series.at(-1).date} (${c.series.length}일)`);
  return L.join('\n');
}

// SVG는 색을 CSS 변수로 쓰는데, data: URL 이미지로 렌더될 때는 문서의 변수 정의가
// 따라가지 않아 전부 검정이 된다 — 직렬화 전에 실제 색으로 치환해야 한다.
function svgToImage(svg, w, h){
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('[data-ui="1"]').forEach(n => n.remove());
  const resolve = s => String(s).replace(/var\((--[\w-]+)(?:\s*,\s*([^)]+))?\)/g,
    (_, name, fb) => cssVar(name, (fb || '').trim() || '#888'));
  clone.querySelectorAll('*').forEach(n => {
    for(const attr of ['stroke', 'fill']){
      const v = n.getAttribute(attr);
      if(v && v.includes('var(')) n.setAttribute(attr, resolve(v));
    }
    const st = n.getAttribute('style');
    if(st && st.includes('var(')) n.setAttribute('style', resolve(st));
  });
  clone.setAttribute('xmlns', SVGNS);
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.style.fontFamily = PNG_FONT;
  // SVG 자체는 투명이라 그대로 저장하면 밝은 문서에 붙일 때 글자가 안 보인다
  const bg = document.createElementNS(SVGNS, 'rect');
  bg.setAttribute('x', '0'); bg.setAttribute('y', '0');
  bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%');
  bg.setAttribute('fill', cssVar('--surface', '#ffffff'));
  clone.insertBefore(bg, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('SVG 렌더 실패'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  });
}

function wrapLines(ctx, text, maxW){
  const out = [];
  for(const raw of String(text).split('\n')){
    const line = raw.replace(/^##\s+/, '').replace(/^\s*-\s+/, '• ').trim();
    if(!line) continue;
    const indent = line.startsWith('•') ? '   ' : '';
    let cur = '';
    for(const word of line.split(' ')){
      const next = cur ? cur + ' ' + word : word;
      if(ctx.measureText(next).width > maxW && cur){ out.push(cur); cur = indent + word; }
      else cur = next;
    }
    if(cur) out.push(cur);
  }
  return out;
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportPNG(svg, d, title){
  if(!svg){ toast('그래프가 없습니다'); return; }
  try{
    const vb = svg.viewBox.baseVal;
    const SCALE = 2;                       // 보고서에 붙여도 안 깨지게
    const cw = Math.round(vb.width * SCALE), ch = Math.round(vb.height * SCALE);
    const padX = 30, titleY = 40, gap = 18, lineH = 27;

    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    ctx.font = '17px ' + PNG_FONT;
    const lines = wrapLines(ctx, chartSummaryText(d).split('\n').slice(2).join('\n'), cw - 10);

    cv.width = cw + padX * 2;
    cv.height = titleY + 16 + ch + gap + lines.length * lineH + 24;
    ctx.fillStyle = cssVar('--bg', '#ffffff');
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = cssVar('--ink', '#000000');
    ctx.font = 'bold 25px ' + PNG_FONT;
    ctx.fillText(title, padX, titleY);

    const img = await svgToImage(svg, cw, ch);
    ctx.drawImage(img, padX, titleY + 16, cw, ch);

    ctx.font = '17px ' + PNG_FONT;
    ctx.fillStyle = cssVar('--ink-muted', '#555555');
    lines.forEach((ln, k) => ctx.fillText(ln, padX, titleY + 16 + ch + gap + 14 + k * lineH));

    downloadBlob(await new Promise(r => cv.toBlob(r, 'image/png')), fileSafe(title) + '.png');
    toast('PNG로 저장했습니다');
  }catch(err){
    toast('PNG 저장 실패: ' + err.message);
  }
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast('클립보드에 복사했습니다');
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('클립보드에 복사했습니다'); }
    catch(__){ toast('복사가 차단되었습니다'); }
    ta.remove();
  }
}

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
}

// 뷰를 그린 뒤 한 번 호출 — 크로스헤어와 내보내기 버튼을 연결한다.
function wireChart(d, p){
  hideTip();
  const svg = p.body.querySelector('svg.ix');
  if(svg) attachCrosshair(svg, d, p);
  const acts = p.body.querySelector('.chart-acts');
  if(!acts) return;
  const title = d.view === 'compare' ? `${d.factor} · 장비 4대 비교` : `${d.machine} · ${d.factor}`;
  acts.querySelector('[data-png]').onclick = () => exportPNG(svg, d, title);
  acts.querySelector('[data-copy]').onclick = () => copyText(chartSummaryText(d));
}

// ===================================================================
// 에이전트 — 자연어를 "선택 UI의 단축키"로 쓴다. 답변에 딸려온 view_state로
// 화면을 옮기므로, 질문이 갈 수 있는 곳은 여전히 위 4개 뷰뿐이다.
// ===================================================================
// 지원 문법은 agent.py 프롬프트가 모델에게 약속한 5개와 **정확히 같아야 한다**
// (`### 헤더`, `**볼드**`, `` `코드` ``, `- 목록`, `| 표 |`). 표는 빠져 있었는데,
// 프롬프트는 미확정 이상치와 recipe_hotspots를 표로 답하라고 지시한다 — 그래서 그
// 답변들은 화면에 파이프 문자가 그대로 찍히고 있었다.
function md(s){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  // 양끝 파이프는 있어도 없어도 받는다(모델이 `|a|b|`와 `a | b` 사이를 오간다).
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const isRow=l=>l.includes('|');
  const isSep=l=>isRow(l)&&/^[\s|:-]+$/.test(l)&&l.includes('-');

  const lines=String(s).split('\n');
  let html='',inList=false,i=0;
  const closeList=()=>{ if(inList){html+='</ul>';inList=false;} };

  while(i<lines.length){
    const line=lines[i];
    // 구분선(`|---|---|`)이 뒤따를 때만 표로 본다. 문장 속 파이프 하나를 표로 오인하면
    // 답변이 통째로 깨지므로, 헤더+구분선 두 줄이 다 맞아야 표를 시작한다.
    if(isRow(line)&&isSep(lines[i+1]||'')){
      closeList();
      const head=cells(line);
      const body=[];
      for(i+=2;i<lines.length&&isRow(lines[i])&&lines[i].trim();i++) body.push(cells(lines[i]));
      html+='<div class="tw"><table><thead><tr>'
          + head.map(c=>`<th>${inline(c)}</th>`).join('') + '</tr></thead>'
          + (body.length ? '<tbody>' + body.map(r=>'<tr>'
              + r.map(c=>`<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody>' : '')
          + '</table></div>';
      continue;
    }
    if(/^#{1,3}\s+/.test(line)){ closeList(); html+=`<h3>${inline(line.replace(/^#{1,3}\s+/,''))}</h3>`; }
    else if(/^\s*-\s+/.test(line)){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${inline(line.replace(/^\s*-\s+/,''))}</li>`; }
    else { closeList(); if(line.trim()) html+=`<p>${inline(line)}</p>`; }
    i++;
  }
  closeList();
  return html;
}

let sending=false;
async function ask(question){
  if(sending || !question.trim()) return;
  sending=true; $('send').disabled=true;
  const msgs=$('msgs');
  msgs.insertAdjacentHTML('beforeend', `<div class="m u">${esc(question)}</div>`);
  $('q').value=''; fitInput();
  const typing=document.createElement('div');
  typing.className='m a'; typing.textContent='…';
  msgs.appendChild(typing); msgs.scrollTop=msgs.scrollHeight;
  try{
    const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question})});
    const data=await res.json();
    typing.remove();
    if(!res.ok || data.error){
      msgs.insertAdjacentHTML('beforeend', `<div class="m a err">${esc(data.error||'오류가 발생했습니다.')}</div>`);
    } else {
      msgs.insertAdjacentHTML('beforeend', `<div class="m a">${md(data.answer||'(응답 없음)')}</div>`);
      if(data.view_state){
        const s=data.view_state;
        msgs.insertAdjacentHTML('beforeend',
          `<div class="jump">화면을 ${s.machine?s.machine+' · ':''}${esc(s.factor||'')}로 옮겼습니다</div>`);
        setState(s);
      }
    }
  }catch(err){
    typing.remove();
    msgs.insertAdjacentHTML('beforeend', `<div class="m a err">서버에 연결할 수 없습니다: ${esc(err.message)}</div>`);
  }finally{
    sending=false; $('send').disabled=false; msgs.scrollTop=msgs.scrollHeight; $('q').focus();
  }
}

// 입력창 높이를 내용에 맞춘다. 38px로 되돌릴 때 scrollHeight를 먼저 재면 이전 높이가
// 남아 계속 커지므로, auto로 접었다가 다시 잰다.
function fitInput(){
  const q=$('q');
  q.style.height='auto';
  q.style.height=Math.min(q.scrollHeight,120)+'px';
}
$('send').onclick=()=>ask($('q').value);
$('q').oninput=fitInput;
$('q').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask($('q').value); } };
$('closeAgent').onclick=()=>$('app').classList.add('agent-closed');
$('reopenAgent').onclick=()=>$('app').classList.remove('agent-closed');

boot();
</script>
